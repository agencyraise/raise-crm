<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaiseHot CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   RAISESHOT CRM — DESIGN SYSTEM
   Estética: Editorial refinada, tipografia forte, roxo vibrante
============================================================ */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');

:root {
  --p: #7C3AED;
  --p2: #6D28D9;
  --p3: #EDE9FE;
  --p4: #F5F3FF;
  --bg: #FAFAF9;
  --sur: #FFFFFF;
  --bor: #E5E7EB;
  --bor2: #D1D5DB;
  --tx1: #111827;
  --tx2: #374151;
  --tx3: #6B7280;
  --tx4: #9CA3AF;
  --ok: #059669;
  --ok2: #D1FAE5;
  --warn: #D97706;
  --warn2: #FEF3C7;
  --err: #DC2626;
  --err2: #FEE2E2;
  --info: #2563EB;
  --info2: #DBEAFE;
  --sidebar: 240px;
  --r: 10px;
  --r2: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow2: 0 4px 16px rgba(124,58,237,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx1);font-size:14px;line-height:1.5}
body{overflow:hidden}
h1,h2,h3,.brand{font-family:'Syne',sans-serif}
button{cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;border:none;outline:none;transition:all .15s}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:14px;outline:none;border:1px solid var(--bor2);border-radius:var(--r2);padding:8px 12px;width:100%;background:var(--sur);color:var(--tx1);transition:border .15s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{resize:vertical;min-height:80px}
a{color:var(--p);text-decoration:none}

/* ---- PORTAL SELECTOR ---- */
#portal-selector{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:32px;overflow-y:auto;padding:24px}
.ps-brand{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--p);letter-spacing:-1px}
.ps-sub{color:var(--tx3);font-size:15px;margin-top:-20px}
.ps-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.ps-card{background:var(--sur);border:2px solid var(--bor);border-radius:var(--r);padding:28px 36px;cursor:pointer;text-align:center;transition:all .2s;min-width:160px}
.ps-card:hover,.ps-card.active{border-color:var(--p);background:var(--p4);box-shadow:var(--shadow2)}
.ps-card-icon{font-size:32px;margin-bottom:12px}
.ps-card-label{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--tx1)}
.ps-card-desc{font-size:12px;color:var(--tx3);margin-top:4px}
.ps-select-row{display:flex;flex-direction:column;gap:8px;align-items:center}
.ps-select-row label{font-size:13px;color:var(--tx2);font-weight:500}
.ps-select-row select{max-width:280px}
.ps-access-box{display:none;flex-direction:column;gap:10px;align-items:center;width:min(320px,100%)}
.ps-access-box input{max-width:280px;text-align:center}
.ps-error{display:none;max-width:320px;background:var(--err2);color:var(--err);border:1px solid #FCA5A5;border-radius:var(--r2);padding:10px 12px;font-size:13px;text-align:center}
.ps-enter{background:var(--p);color:#fff;padding:12px 32px;border-radius:var(--r2);font-weight:600;font-size:15px;letter-spacing:.3px}
.ps-enter:hover{background:var(--p2);transform:translateY(-1px)}

/* ---- LAYOUT ---- */
#app{display:flex;height:100dvh;min-height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar);background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#main{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}

/* ---- SIDEBAR ---- */
.sb-header{padding:20px 16px 16px;border-bottom:1px solid var(--bor)}
.sb-brand{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--p);letter-spacing:-0.5px}
.sb-portal-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--p3);color:var(--p);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.sb-user{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bor)}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-user-name{font-size:13px;font-weight:500;color:var(--tx1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.sb-user-role{font-size:11px;color:var(--tx3)}
.sb-nav{padding:8px 0;flex:1}
.sb-section{padding:16px 16px 4px;font-size:10px;font-weight:600;color:var(--tx4);text-transform:uppercase;letter-spacing:.8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-radius:0;transition:all .15s;color:var(--tx2);font-size:13px;font-weight:400;border-left:3px solid transparent;margin:1px 0}
.sb-item:hover{background:var(--p4);color:var(--p)}
.sb-item.active{background:var(--p4);color:var(--p);border-left-color:var(--p);font-weight:500}
.sb-item-icon{font-size:16px;width:20px;text-align:center}
.sb-footer{padding:12px 16px;border-top:1px solid var(--bor)}
.sb-switch{font-size:12px;color:var(--p);cursor:pointer;font-weight:500}
.sb-switch:hover{text-decoration:underline}

/* ---- TOPBAR ---- */
#topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100}
.tb-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--tx1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-badge{background:var(--err2);color:var(--err);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}

/* ---- CONTENT ---- */
#content{padding:24px;min-width:0}
.page{display:none}
.page.active{display:block}

/* ---- CARDS ---- */
.card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--tx1);margin-bottom:16px;overflow-wrap:anywhere}

/* ---- GRID STATS ---- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stat-label{font-size:11px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--tx1);line-height:1;overflow-wrap:anywhere}
.stat-sub{font-size:11px;color:var(--tx3);margin-top:4px}
.stat-card.accent{background:var(--p);border-color:var(--p)}
.stat-card.accent .stat-label,.stat-card.accent .stat-val,.stat-card.accent .stat-sub{color:#fff}

/* ---- BUTTONS ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--r2);font-weight:500;font-size:13px;transition:all .15s;cursor:pointer;border:none;white-space:normal;text-align:center}
.btn-primary{background:var(--p);color:#fff}
.btn-primary:hover{background:var(--p2);transform:translateY(-1px);box-shadow:var(--shadow2)}
.btn-secondary{background:var(--sur);color:var(--tx2);border:1px solid var(--bor2)}
.btn-secondary:hover{border-color:var(--p);color:var(--p)}
.btn-danger{background:var(--err2);color:var(--err);border:1px solid #FCA5A5}
.btn-danger:hover{background:var(--err)}
.btn-success{background:var(--ok2);color:var(--ok);border:1px solid #6EE7B7}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---- BADGES ---- */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-ok{background:var(--ok2);color:var(--ok)}
.badge-warn{background:var(--warn2);color:var(--warn)}
.badge-err{background:var(--err2);color:var(--err)}
.badge-info{background:var(--info2);color:var(--info)}
.badge-purple{background:var(--p3);color:var(--p)}

/* ---- TABLE ---- */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bor)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bor)}
td{padding:10px 14px;border-bottom:1px solid var(--bor);font-size:13px;color:var(--tx2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--p4)}

/* ---- MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--sur);border-radius:var(--r);max-width:520px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;margin:auto}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--sur);z-index:1}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--bor);color:var(--tx2);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--bor);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--sur)}

/* ---- FORM ---- */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---- TOAST ---- */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{padding:12px 16px;border-radius:var(--r2);font-size:13px;font-weight:500;max-width:320px;animation:slideIn .2s ease;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.toast-ok{background:var(--ok);color:#fff}
.toast-err{background:var(--err);color:#fff}
.toast-warn{background:var(--warn);color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---- SAÚDE ---- */
.saude-bar{height:6px;border-radius:3px;background:var(--bor);overflow:hidden;margin-top:6px}
.saude-fill{height:100%;border-radius:3px;transition:width .4s}
.saude-verde .saude-fill{background:var(--ok)}
.saude-amarela .saude-fill{background:var(--warn)}
.saude-vermelha .saude-fill{background:var(--err)}

/* ---- PROJETO CARD ---- */
.projeto-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;transition:box-shadow .2s;min-width:0}
.projeto-card:hover{box-shadow:var(--shadow2);border-color:var(--p)}
.pj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;min-width:0}
.pj-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;overflow-wrap:anywhere;min-width:0}
.pj-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pj-meta-item{font-size:12px;color:var(--tx3)}
.pj-meta-val{font-weight:600;color:var(--tx1)}

/* ---- ALERTA CARD ---- */
.alerta-item{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r2);border:1px solid var(--bor);background:var(--sur);margin-bottom:8px;align-items:flex-start}
.alerta-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.alerta-msg{font-size:13px;color:var(--tx1)}
.alerta-criador{font-size:11px;color:var(--tx3);margin-top:2px}
.alerta-item.alta{border-left:3px solid var(--err);background:var(--err2)}
.alerta-item.media{border-left:3px solid var(--warn);background:var(--warn2)}
.alerta-item.baixa{border-left:3px solid var(--info);background:var(--info2)}

/* ---- ROTINA ---- */
.rotina-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r2);border:1px solid var(--bor);background:var(--sur);margin-bottom:8px;transition:all .2s}
.rotina-item.rotina-admin{border-left:4px solid var(--p);background:#F4F0FF}
.rotina-item.rotina-operador{border-left:4px solid var(--info);background:var(--info2)}
.rotina-item.rotina-criador{border-left:4px solid var(--ok);background:var(--ok2)}
.rotina-item.rotina-admin-criador{border-left:4px solid var(--warn);background:var(--warn2)}
.rotina-item.feito{opacity:.6;background:var(--bg)}
.rotina-item.feito .ri-desc{text-decoration:line-through;color:var(--tx3)}
.ri-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--bor2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.ri-check.done{background:var(--ok);border-color:var(--ok)}
.ri-desc{font-size:13px;flex:1}
.ri-resp{font-size:11px;color:var(--tx3)}
.rotina-painel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rotina-painel-card{border:1px solid var(--bor);border-radius:var(--r);background:var(--sur);padding:14px;min-width:0}
.rotina-painel-card.admin{border-top:4px solid var(--p)}
.rotina-painel-card.operador{border-top:4px solid var(--info)}
.rotina-painel-card.criador{border-top:4px solid var(--ok)}
.rotina-painel-card.admin_criador{border-top:4px solid var(--warn)}
.rotina-status-line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bor);font-size:12px}
@media (max-width:900px){.rotina-painel{grid-template-columns:1fr}}

/* ---- CHAMADO ---- */
.chamado-item{border:1px solid var(--bor);border-radius:var(--r2);padding:14px 16px;margin-bottom:10px;background:var(--sur)}
.chamado-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;min-width:0}
.chamado-titulo{font-weight:600;font-size:13px;overflow-wrap:anywhere;min-width:0}
.chamado-meta{font-size:11px;color:var(--tx3);margin-top:4px}

/* ---- NOTIFICAÇÃO ---- */
.notif-item{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r2);border:1px solid var(--bor);background:var(--sur);margin-bottom:8px;align-items:center}
.notif-item.prioritaria{border-left:4px solid var(--err);background:var(--err2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
.notif-msg{flex:1;font-size:13px}
.notif-item.prioritaria .notif-msg{font-weight:600;color:var(--err)}

/* ---- FINANCEIRO ---- */
.fin-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bor);gap:12px;min-width:0}
.fin-tipo{font-size:12px;font-weight:600}
.fin-desc{font-size:12px;color:var(--tx3);overflow-wrap:anywhere}
.fin-val{font-weight:700;font-size:14px;text-align:right;overflow-wrap:anywhere}
.fin-entrada{color:var(--ok)}
.fin-saida{color:var(--err)}

/* ---- TABS ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bor);margin-bottom:20px;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.tab:hover{color:var(--p)}

/* ---- EMPTY STATE ---- */
.empty{text-align:center;padding:48px 24px;color:var(--tx3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-msg{font-size:14px}

/* ---- PROGRESS ---- */
.progress{height:8px;background:var(--bor);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:var(--p);transition:width .4s}

/* ---- MOBILE ---- */
#menu-toggle{display:none;background:var(--sur);border:1px solid var(--bor);border-radius:var(--r2);padding:6px 10px;font-size:18px;color:var(--tx1)}
@media(max-width:768px){
  #menu-toggle{display:flex;align-items:center}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:2000;transition:transform .3s;transform:translateX(-100%);box-shadow:0 20px 60px rgba(0,0,0,.22)}
  #sidebar.open{transform:translateX(0)}
  #main{width:100%}
  #topbar{padding:0 16px}
  #content{padding:16px}
  .stats-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .pj-meta{grid-template-columns:1fr}
  .section-header{align-items:flex-start;flex-direction:column;gap:10px}
  .section-header .btn{width:100%}
  .modal-overlay{align-items:flex-start;padding:12px}
  .modal{max-height:calc(100dvh - 24px)}
  .modal-header,.modal-body,.modal-footer{padding-left:16px;padding-right:16px}
  #toast-container{left:16px;right:16px;bottom:16px}
  .toast{max-width:none;width:100%}
  .ps-cards{flex-direction:column;align-items:center}
}

/* ---- MISC ---- */
.sep{height:1px;background:var(--bor);margin:20px 0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;min-width:0}
.section-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--tx1);overflow-wrap:anywhere;min-width:0}
.text-muted{color:var(--tx3);font-size:12px}
.mt-4{margin-top:16px}
.mb-4{margin-bottom:16px}
.gap-2{gap:8px}
.flex{display:flex}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cofre-field{background:var(--bg);border:1px solid var(--bor);border-radius:var(--r2);padding:8px 12px;font-family:monospace;font-size:12px;filter:blur(4px);cursor:pointer;transition:.2s}
.cofre-field.revealed{filter:none}

@media(max-width:768px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .section-header{align-items:flex-start;flex-direction:column;gap:10px}
  .section-header .btn{width:100%}
}
</style>
</head>
<body>

<!-- PORTAL SELECTOR -->
<div id="portal-selector">
  <div class="ps-brand">🔥 RaiseHot</div>
  <div class="ps-sub">Selecione seu portal de acesso</div>
  <div class="ps-cards">
    <div class="ps-card" onclick="selectPortal('admin')">
      <div class="ps-card-icon">🛡️</div>
      <div class="ps-card-label">Admin</div>
      <div class="ps-card-desc">Visão total do CRM</div>
    </div>
    <div class="ps-card" onclick="selectPortal('operador')">
      <div class="ps-card-icon">👤</div>
      <div class="ps-card-label">Operador</div>
      <div class="ps-card-desc">Gerenciar criadores</div>
    </div>
    <div class="ps-card" onclick="selectPortal('criador')">
      <div class="ps-card-icon">⭐</div>
      <div class="ps-card-label">Criador</div>
      <div class="ps-card-desc">Meu painel</div>
    </div>
  </div>
  <div id="portal-sub-select" style="display:none" class="ps-select-row">
    <label id="portal-sub-label"></label>
    <select id="portal-sub-dropdown"></select>
  </div>
  <div id="portal-access-box" class="ps-access-box">
    <label style="font-size:13px;color:var(--tx2);font-weight:500">Senha de acesso</label>
    <input id="portal-password" type="password" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter') enterPortal()">
    <div id="portal-login-error" class="ps-error"></div>
  </div>
  <button class="btn btn-primary ps-enter" onclick="enterPortal()" style="display:none" id="btn-enter">Entrar no CRM →</button>
</div>

<!-- APP -->
<div id="app" style="display:none;position:relative">
  <!-- SIDEBAR -->

function rotinaDoDia(obrigacoes, dia, responsaveis = null) {
  return (obrigacoes || []).filter(o => {
    const resp = normalizarResponsavel(o.responsavel);
    const diaOk = o.dia === 'todos' || o.dia === dia;
    const respOk = !responsaveis || responsaveis.includes(resp);
    return diaOk && respOk && obrigacaoExibivel(o);
  });
}
function chaveObrigacao(o) {
  return `${o.dia}|${normalizarResponsavel(o.responsavel)}|${String(o.descricao || '').trim().toLowerCase()}`;
}
function obrigacaoOficial(o) {
  const chave = chaveObrigacao(o);
  return ROTINA_OFICIAL.some(item => chaveObrigacao(item) === chave);
}
function obrigacaoExibivel(o) {
  const desc = String(o.descricao || '').trim().toLowerCase();
  if (o.dia === 'quarta' && desc === 'envio de ideias de conteudo') return false;
  if (o.dia === 'terca' && desc === 'programar tiktok da semana') return false;
  if (['agencia','ambos'].includes(o.responsavel) && !obrigacaoOficial(o)) return false;
  return true;
}
function normalizarResponsavel(resp) {
  if (resp === 'agencia') return 'operador';
  if (resp === 'ambos') return 'admin_criador';
  return resp || 'todos';
}
function labelResponsavel(resp) {
  return {
    admin:'ADM',
    operador:'Operador',
    criador:'Criador',
    admin_criador:'ADM + Criador',
    todos:'Todos'
  }[normalizarResponsavel(resp)] || resp;
}

  return resumoTarefasCriadorData(criadorId, hoje());
}
async function resumoTarefasCriadorData(criadorId, dataIso) {
  const diaHoje = diaNomeDeData(dataIso);
  const { data: obrigacoes } = await sb.from('obrigacoes').select('*').eq('ativo', true);
  const tarefas = rotinaDoDia(obrigacoes, diaHoje, ['criador','admin_criador','todos']);
  const ids = tarefas.map(t => t.id);
  const { data: status } = await sb.from('rotina_status').select('obrigacao_id,feito').eq('criador_id', criadorId).eq('data', dataIso);
  const feitasIds = new Set((status || []).filter(s => s.feito).map(s => s.obrigacao_id));
  const feitas = tarefas.filter(t => feitasIds.has(t.id));
  const pendentes = tarefas.filter(t => !feitasIds.has(t.id));
  return {total: ids.length, feitas, pendentes};
}
async function resumoMidiasSemana(criadorId) {
  const { data: midias } = await sb.from('midias_status').select('status,tipo,notificado').eq('criador_id', criadorId).gte('semana', inicioSemana());
  const registros = midias || [];
  const enviadas = registros.filter(m => ['enviado','aprovado'].includes(m.status));
  const pendentes = registros.filter(m => m.status === 'pendente');
  return {registros, enviadas, pendentes, faltandoEnvio: enviadas.length === 0};
}

const dataBR = (date = new Date()) => {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Sao_Paulo',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(date).reduce((acc, part) => {
    acc[part.type] = part.value;
    return acc;
  }, {});
  return `${parts.year}-${parts.month}-${parts.day}`;
};
const hoje = () => dataBR();
const mesAtual = () => hoje().slice(0,7);
const diasSemana = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
const diaNome = () => {
  const short = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Sao_Paulo', weekday: 'short' }).format(new Date());
  const map = {Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6};
  return diasSemana[map[short] ?? 0];
};
const inicioSemana = () => {
  const [y,m,d] = hoje().split('-').map(Number);
  const base = new Date(y, m - 1, d, 12);
  base.setDate(base.getDate() - base.getDay());
  return dataBR(base);
};
const dataRelativa = (deltaDias) => {
  const [y,m,d] = hoje().split('-').map(Number);
  const base = new Date(y, m - 1, d, 12);
  base.setDate(base.getDate() + deltaDias);
  return dataBR(base);
};
function diaNomeDeData(dataIso) {
  const [y,m,d] = dataIso.split('-').map(Number);
  const dt = new Date(y, m - 1, d, 12);
  return diasSemana[dt.getDay()];
}

function fmt(val) {
  const n = Number(val) || 0;
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace('.0','') + 'Ml';
  if (n >= 1_000) return (n/1_000).toFixed(1).replace('.0','') + 'k';
  return n.toString();
}
function fmtBRL(val) {
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(val)||0);
}
function somarKpisPorMetrica(kpis = []) {
  return kpis.reduce((acc, item) => {
    const metrica = normalizarMetrica(item.metrica);
    acc[metrica] = (acc[metrica] || 0) + Number(item.valor || 0);
    return acc;
  }, {});
}
function resumoIndicadores(faturamentos = [], kpis = []) {
  const sociais = plataformasSociais();
  const adultos = plataformasFaturamento();
  const kpisNormalizados = (kpis || []).map(k => ({...k, plataforma: plataformaCanonica(k.plataforma), metrica: normalizarMetrica(k.metrica)}));
  const faturamentosNormalizados = (faturamentos || []).map(f => ({...f, plataforma: plataformaCanonica(f.plataforma)}));
  const kpisSociais = kpisNormalizados.filter(k => sociais.includes(k.plataforma));
  const kpisAdultos = kpisNormalizados.filter(k => adultos.includes(k.plataforma));
  const totalFat = faturamentosNormalizados.reduce((acc, f) => acc + Number(f.valor || 0), 0);
  const totalFatVendaAvulsa = faturamentosNormalizados.filter(f => f.plataforma === 'Venda Avulsa').reduce((acc, f) => acc + Number(f.valor || 0), 0);
  const totaisSociais = somarKpisPorMetrica(kpisSociais);
  const totaisAdultos = somarKpisPorMetrica(kpisAdultos);
  const totaisGerais = somarKpisPorMetrica(kpis);

  return {
    totalFat,
    seguidores: totaisSociais.seguidores || totaisGerais.seguidores || 0,
    visualizacoes: totaisSociais.visualizacoes || totaisGerais.visualizacoes || 0,
    postagens: totaisSociais.postagens || totaisGerais.postagens || 0,
    assinantes: totaisAdultos.assinantes || totaisGerais.assinantes || 0,
    vendasAvulsas: (totaisAdultos.vendas_avulsas || 0) + totalFatVendaAvulsa,
    engajamento: totaisSociais.engajamento || 0,
    fatPorPlataforma: faturamentosNormalizados.reduce((acc, f) => {
      acc[f.plataforma] = (acc[f.plataforma] || 0) + Number(f.valor || 0);
      return acc;
    }, {}),
    kpiPorPlataforma: kpisNormalizados.reduce((acc, k) => {
      acc[k.plataforma] = acc[k.plataforma] || {};
      acc[k.plataforma][k.metrica] = (acc[k.plataforma][k.metrica] || 0) + Number(k.valor || 0);
      return acc;
    }, {})
  };
}

      .filter(k => k.plataforma === plataforma)
      .reduce((acc, item) => acc + Number(item.valor || 0), 0);
    return `<div class="fin-item"><div class="fin-tipo">${esc(plataforma)}</div><div class="fin-val">${fmt(total)}</div></div>`;
  }).join('');

  return `
    <div class="stats-grid">${cards}</div>
    <div class="card">
      <div class="card-title">KPIs sociais por plataforma</div>
      ${dadosSociais.length ? porPlataforma : '<div class="text-muted">Sem KPIs sociais lancados neste mes.</div>'}
    </div>
  `;
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d+'T12:00:00').toLocaleDateString('pt-BR');
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}
const attr = esc;
function jsArg(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function saudeClass(score) {
  if (score >= 80) return 'verde';
  if (score >= 50) return 'amarela';
  return 'vermelha';
}
function saudeBadge(score) {
  if (score >= 80) return '<span class="badge badge-ok">Saudável</span>';
  if (score >= 50) return '<span class="badge badge-warn">Atenção</span>';
  return '<span class="badge badge-err">Crise</span>';
}

async function validarAcessoCrm(tipo, pessoaId, senha) {
  if (!senha) return {ok:false, mensagem:'Digite a senha de acesso.'};
  const { data, error } = await sb.from('acessos_crm')
    .select('id,nome,tipo,pessoa_id,ativo')
    .eq('tipo', tipo)
    .eq('pessoa_id', pessoaId)
    .eq('senha', senha)
    .eq('ativo', true)
    .limit(1);
  if (error) return {ok:false, mensagem:'Erro ao consultar acessos. Rode o SQL de acessos no Supabase.'};
  if (!data?.length) return {ok:false, mensagem:'Senha incorreta ou acesso não cadastrado.'};

}

async function boot() {
  // Data no topbar
  document.getElementById('tb-date').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

  // Carregar dados base
  const [adm, ops, crs, cfg1, cfg2] = await Promise.all([
    sb.from('admins').select('*').eq('ativo',true),
    sb.from('operadores').select('*').eq('ativo',true),
    sb.from('criadores').select('*').eq('ativo',true),
    sb.from('crm_config').select('*').eq('id','plataformas'),
    sb.from('crm_config').select('*').eq('id','metricas_kpi'),
  ]);
  STATE.admins = adm.data || [];
  STATE.operadores = ops.data || [];
  STATE.criadores = crs.data || [];
  const plataformasConfig = cfg1.data?.[0]?.valor?.length ? cfg1.data[0].valor : [];
  STATE.plataformas = listaUnica([...plataformasConfig, ...PLATAFORMAS_FATURAMENTO, ...PLATAFORMAS_SOCIAIS]);
  const metricasConfig = cfg2.data?.[0]?.valor?.length ? cfg2.data[0].valor : [];
  STATE.metricasKpi = listaUnica([...metricasConfig, ...METRICAS_KPI_PADRAO]);
  await garantirRotinaOficial();
  await verificarAdvertenciasMidiaSemanal();

  // Restaurar sessão
  const savedPortal = localStorage.getItem('rh_portal');
  const savedId = localStorage.getItem('rh_userId');
  const savedName = localStorage.getItem('rh_userName');
  const savedAccess = localStorage.getItem('rh_access_ok') === '1';
  const savedStillValid = savedPortal === 'admin'
    ? STATE.admins.some(a=>a.id===savedId && a.ativo)
    : (savedPortal === 'operador' && STATE.operadores.some(o=>o.id===savedId && o.ativo))
      || (savedPortal === 'criador' && STATE.criadores.some(c=>c.id===savedId && c.ativo));
  if (savedPortal && savedId && savedStillValid && savedAccess) {
    STATE.portal = savedPortal;
    STATE.userId = savedId;
    STATE.userName = savedName;
    document.getElementById('portal-selector').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initApp();
  } else if (savedPortal || savedId) {
    localStorage.removeItem('rh_portal');
    localStorage.removeItem('rh_userId');
    localStorage.removeItem('rh_userName');
    localStorage.removeItem('rh_access_ok');
  }
}

async function garantirRotinaOficial() {
  const { data: existentes, error } = await sb.from('obrigacoes').select('descricao,dia,responsavel').eq('ativo', true);
  if (error) {
    console.warn('Rotina oficial nao conferida:', error.message);
    return;
  }
  const chaves = new Set((existentes || []).map(o => `${o.dia}|${normalizarResponsavel(o.responsavel)}|${o.descricao}`));
  const novas = ROTINA_OFICIAL.filter(o => !chaves.has(`${o.dia}|${o.responsavel}|${o.descricao}`));
  if (novas.length) {
    const { error: insertError } = await sb.from('obrigacoes').insert(novas.map(o => ({...o, ativo:true})));
    if (insertError) console.warn('Rotina oficial nao inserida:', insertError.message);
  }
  await sb.from('obrigacoes')
    .update({ativo:false})
    .eq('dia','quarta')
    .ilike('descricao','Envio de ideias de conteudo');
  await sb.from('obrigacoes')
    .update({ativo:false})
    .eq('dia','terca')
    .ilike('descricao','Programar TikTok da semana');
}

async function carregarObrigacoesAtivas() {
  await garantirRotinaOficial();
  const { data, error } = await sb.from('obrigacoes').select('*').eq('ativo', true);
  if (error) throw error;

  const chaves = new Set((data || []).map(o => `${o.dia}|${normalizarResponsavel(o.responsavel)}|${o.descricao}`));
  const faltantes = ROTINA_OFICIAL.filter(o => !chaves.has(`${o.dia}|${o.responsavel}|${o.descricao}`));
  if (!faltantes.length) return data || [];

  const { error: insertError } = await sb.from('obrigacoes').insert(faltantes.map(o => ({...o, ativo:true})));
  if (insertError) throw insertError;
  const { data: atualizadas, error: refetchError } = await sb.from('obrigacoes').select('*').eq('ativo', true);
  if (refetchError) throw refetchError;
  return atualizadas || [];
}

async function verificarAdvertenciasMidiaSemanal() {
  if (diaNome() !== 'segunda') return;
  const inicio = dataRelativa(-8);
  const fim = dataRelativa(-1);
  const motivo = `Banco de midias nao enviado na semana ${inicio} a ${fim}`;
  for (const cr of STATE.criadores.filter(c=>c.ativo)) {
    const { data: envios } = await sb.from('midias_status')
      .select('id')
      .eq('criador_id', cr.id)
      .eq('semana', inicio)
      .in('status', ['enviado','aprovado']);
    if (envios?.length) continue;

    const { data: existente } = await sb.from('advertencias')
      .select('id')
      .eq('criador_id', cr.id)
      .eq('motivo', motivo)
      .eq('ativo', true)
      .limit(1);
    if (existente?.length) continue;

    const { error } = await sb.from('advertencias').insert({criador_id: cr.id, motivo, gravidade:'media'});
    if (!error) {
      try { await criarNotificacaoCriador(cr.id, `Advertencia media: ${motivo}`, true); } catch(e) {}
    }
  }
}

// ============================================================
// SAÚDE DO PROJETO
// ============================================================
async function calcularSaude(criador_id) {
  const mes = mesAtual();
  const hoje_ = hoje();
  const motivos = [];
  let score = 0;

  // Rotina (25pts)
  const rotinaHoje = await resumoTarefasCriadorData(criador_id, hoje_);
  const pct = rotinaHoje.total > 0 ? rotinaHoje.feitas.length / rotinaHoje.total : 1;
  score += Math.round(pct * 25);
  if (pct < 1) motivos.push(`${rotinaHoje.pendentes.length} tarefa(s) pendente(s) hoje`);

  // Faturamento (20pts)
  const { data: fat } = await sb.from('faturamento').select('valor').eq('criador_id', criador_id).eq('mes', mes);
  const totalFat = fat?.reduce((a,b)=>a+Number(b.valor),0) || 0;
  if (totalFat > 0) score += 20;
  else motivos.push('Sem faturamento no mês');

  // Mídias (20pts)
  const midiasResumo = await resumoMidiasSemana(criador_id);
  if (!midiasResumo.faltandoEnvio && midiasResumo.pendentes.length === 0) score += 20;
  else motivos.push(midiasResumo.faltandoEnvio ? 'Banco de mídias ainda não enviado' : 'Mídias pendentes');

  // Chamados (15pts)
  const diasAtras3 = new Date(); diasAtras3.setDate(diasAtras3.getDate()-3);
  const { data: chAbertos } = await sb.from('chamados').select('id').eq('criador_id', criador_id).eq('status','aberto').lt('created_at', diasAtras3.toISOString());
  if (!chAbertos?.length) score += 15;
  else motivos.push('Chamados abertos há +3 dias');

  // KPIs (10pts)
  const { data: kpis } = await sb.from('kpis_manuais').select('id').eq('criador_id', criador_id).eq('mes', mes);
  if (kpis?.length) score += 10;
  else motivos.push('KPIs não alimentados');

  // Advertências (10pts)
  const { data: adv } = await sb.from('advertencias').select('id').eq('criador_id', criador_id).eq('ativo', true);
  if (!adv?.length) score += 10;
  else motivos.push(`${adv.length} advertência(s) ativa(s)`);

  score = Math.min(100, score);
  const status = score >= 80 ? 'saudável' : score >= 50 ? 'atenção' : 'crise';
  return { score, status, motivos };
}

// ============================================================
// ALERTAS
// ============================================================
async function gerarAlertas() {
  const alertas = [];
  const mes = mesAtual();
  const diasAtras3 = new Date(); diasAtras3.setDate(diasAtras3.getDate()-3);
  const criadores = STATE.criadores.filter(c=>c.ativo);

  for (const cr of criadores) {
    // Rotina atrasada
    const rotinaHoje = await resumoTarefasCriadorData(cr.id, hoje());
    if (rotinaHoje.pendentes.length) {
      alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'rotina', mensagem:`${rotinaHoje.pendentes.length} tarefa(s) do criador pendente(s) hoje`, urgencia:'media'});
    }

    // Mídias pendentes
    const mid = await resumoMidiasSemana(cr.id);
    if (mid.faltandoEnvio) alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'midia', mensagem:'Banco de mídias da semana ainda não enviado', urgencia:'media'});
    else if (mid.pendentes.length) alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'midia', mensagem:`${mid.pendentes.length} mídia(s) pendente(s)`, urgencia:'media'});

    // KPI ausente no mês
    const { data: kpi } = await sb.from('kpis_manuais').select('id').eq('criador_id', cr.id).eq('mes', mes);
    if (!kpi?.length) alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'kpi', mensagem:'KPIs não alimentados no mês', urgencia:'baixa'});

    // Faturamento zero
    const { data: fat } = await sb.from('faturamento').select('valor').eq('criador_id', cr.id).eq('mes', mes);
    if (!fat?.length) alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'faturamento', mensagem:'Sem faturamento lançado no mês', urgencia:'alta'});

    // Chamados abertos +3 dias
    const { data: ch } = await sb.from('chamados').select('id').eq('criador_id', cr.id).eq('status','aberto').lt('created_at', diasAtras3.toISOString());
    if (ch?.length) alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'chamado', mensagem:`${ch.length} chamado(s) aberto(s) há +3 dias`, urgencia:'alta'});

    // Advertências ativas
    const { data: adv } = await sb.from('advertencias').select('id,motivo,gravidade').eq('criador_id', cr.id).eq('ativo', true);
    if (adv?.length) {
      const graves = adv.filter(a => a.gravidade === 'alta').length;
      const motivo = adv[0]?.motivo ? ` Motivo recente: ${adv[0].motivo}` : '';
      alertas.push({criador_id:cr.id, criador:cr.nome, tipo:'advertencia', mensagem:`${adv.length} advertencia(s) ativa(s), ${graves} alta(s).${motivo}`, urgencia:graves ? 'alta' : 'media'});
    }
  }

  // Logs não vistos
  const { data: logs } = await sb.from('logs_extra').select('*, operadores(nome), criadores(nome)').eq('visto_admin', false);
  if (logs?.length) alertas.push({criador_id:null, criador:'Equipe', tipo:'log', mensagem:`${logs.length} log(s) não visto(s) pelo admin`, urgencia:'media'});

  return alertas;
}

async function salvarNovoCriador() {
  if (!requireAdmin('cadastro de criador')) return;
  const nome = document.getElementById('nc-nome').value.trim();
  const codigo = document.getElementById('nc-codigo').value.trim();
  const opId = document.getElementById('nc-op').value;
  if (!nome || !codigo) { toast('Preencha todos os campos','warn'); return; }
  const id = codigo;
  const { error } = await sb.from('criadores').insert({id, nome, codigo, operador_id: opId});
  if (error) { toast('Erro: '+error.message,'err'); return; }
  // Criar dossie vazio sem travar o cadastro se ele ja existir.
  const { error: dossieError } = await sb.from('dossies').insert({id});
  if (dossieError && dossieError.code !== '23505') console.warn('Dossie inicial nao criado:', dossieError.message);
  toast('Criador adicionado!','ok');
  closeModal();
  // Atualizar cache
  STATE.criadores.push({id, nome, codigo, operador_id: opId, ativo: true});
  renderPage('projetos');
}

// ============================================================
function classeRotinaResponsavel(resp) {
  const r = normalizarResponsavel(resp);
  return r === 'admin_criador' ? 'admin-criador' : r;
}
function badgeRotinaResponsavel(resp) {
  const r = normalizarResponsavel(resp);
  const badge = {admin:'badge-purple', operador:'badge-info', criador:'badge-ok', admin_criador:'badge-warn', todos:'badge-info'}[r] || 'badge-info';
  return `<span class="badge ${badge}">${esc(labelResponsavel(r))}</span>`;
}
function criadoresAlvoDaRotina(tipo, criadores) {
  if (tipo === 'operador') return criadores.filter(c => !!c.operador_id);
  return criadores;
}
function resumoStatusObrigacao(ob, statusHoje, criadoresAlvo) {
  const ids = new Set(criadoresAlvo.map(c => c.id));
  const feitos = (statusHoje || []).filter(s => s.obrigacao_id === ob.id && s.feito && ids.has(s.criador_id));
  const feitosIds = new Set(feitos.map(s => s.criador_id));
  const pendentes = criadoresAlvo.filter(c => !feitosIds.has(c.id));
  return {feitos, pendentes, total: criadoresAlvo.length, qtdFeitas: feitos.length};
}
function nomesCriadoresResumo(lista, limite = 5) {
  if (!lista.length) return 'Nenhum';
  const nomes = lista.slice(0, limite).map(c => c.nome).join(', ');
  return lista.length > limite ? `${nomes} +${lista.length - limite}` : nomes;
}
function renderRotinaGrupoAdmin(titulo, tipo, obrigacoesGrupo, statusHoje, criadores, permitirMarcar = false) {
  const cls = tipo === 'admin_criador' ? 'admin-criador' : tipo;
  const alvo = criadoresAlvoDaRotina(tipo, criadores);
  return `<div class="rotina-painel-card ${attr(tipo)}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">${esc(titulo)}</div>
      ${badgeRotinaResponsavel(tipo)}
    </div>
    ${!obrigacoesGrupo.length ? '<div class="text-muted">Nenhuma tarefa para hoje.</div>' : obrigacoesGrupo.map(ob => {
      const r = resumoStatusObrigacao(ob, statusHoje, alvo);
      const pct = r.total > 0 ? Math.round((r.qtdFeitas / r.total) * 100) : 0;
      const feito = r.total > 0 && r.qtdFeitas >= r.total;
      return `<div class="rotina-item rotina-${attr(cls)} ${feito?'feito':''}">
        ${permitirMarcar ? `<div class="ri-check ${feito?'done':''}" onclick="toggleObrigacaoGlobal(this,'${jsArg(ob.id)}')">${feito?'✓':''}</div>` : `<div class="ri-check ${feito?'done':''}" style="cursor:default">${feito?'✓':''}</div>`}
        <div style="flex:1;min-width:0">
          <div class="ri-desc">${esc(ob.descricao)}</div>
          <div class="ri-resp">${r.qtdFeitas}/${r.total} concluido(s) · pendentes: ${esc(nomesCriadoresResumo(r.pendentes, 4))}</div>
          <div class="progress mt-4"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

    <div class="rotina-painel" id="rotina-painel"></div>
    <div class="sep"></div>
    <div class="section-title mb-4">Pendencias de ontem</div>
    <div id="rotina-atrasos"></div>
  </div>`;

  const { data: statusHojeGlobal } = await sb.from('rotina_status').select('obrigacao_id,criador_id,feito').eq('data', hoje());
  document.getElementById('rotina-painel').innerHTML = [
    renderRotinaGrupoAdmin('Rotina do ADM', 'admin', rotinaAdmin, statusHojeGlobal || [], criadores, true),
    renderRotinaGrupoAdmin('Rotina do Colaborador', 'operador', rotinaOperador, statusHojeGlobal || [], criadores, false),
    renderRotinaGrupoAdmin('Rotina do Criador', 'criador', rotinaCriador, statusHojeGlobal || [], criadores, false),
    renderRotinaGrupoAdmin('Responsabilidade Conjunta', 'admin_criador', rotinaConjunta, statusHojeGlobal || [], criadores, false)
  ].join('');

  const atrasosDiv = document.getElementById('rotina-atrasos');
  const dataOntem = dataRelativa(-1);
  const diaOntem = diaNomeDeData(dataOntem);
  const rotinaOntem = rotinaDoDia(obrigacoes, diaOntem, ['operador','criador','admin_criador','todos']);
  const idsOntem = rotinaOntem.map(o=>o.id);
  const { data: statusOntem } = idsOntem.length
    ? await sb.from('rotina_status').select('obrigacao_id,criador_id,feito').eq('data', dataOntem).in('obrigacao_id', idsOntem)
    : { data: [] };
  const feitasOntem = new Set((statusOntem || []).filter(s=>s.feito).map(s=>`${s.criador_id}|${s.obrigacao_id}`));
  const pendencias = [];
  for (const cr of criadores) {
    for (const ob of rotinaOntem) {
      if (!feitasOntem.has(`${cr.id}|${ob.id}`)) pendencias.push({criador:cr.nome, tarefa:ob.descricao, resp:labelResponsavel(ob.responsavel)});
    }
  }
  atrasosDiv.innerHTML = pendencias.length ? pendencias.slice(0,24).map(p=>`<div class="alerta-item media">
    <div class="alerta-icon">!</div><div><div class="alerta-msg">${esc(p.tarefa)}</div><div class="alerta-criador">${esc(p.criador)} · ${esc(p.resp)}</div></div>
  </div>`).join('') : '<div class="alerta-item baixa"><div class="alerta-icon">✓</div><div><div class="alerta-msg">Nenhuma pendencia do dia anterior.</div></div></div>';
}
async function salvarRotinaParaCriadores(obId, feito, criadorIds) {
  const data = hoje();
  for (const criador_id of criadorIds) {
    const { data: atual, error: eBusca } = await sb.from('rotina_status')
      .select('id')
      .eq('criador_id', criador_id)
      .eq('obrigacao_id', obId)
      .eq('data', data)
      .limit(1);
    if (eBusca) throw eBusca;
    if (atual?.length) {
      const { error } = await sb.from('rotina_status').update({feito}).eq('id', atual[0].id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('rotina_status').insert({criador_id, obrigacao_id: obId, feito, data});
      if (error) throw error;
    }
  }
}

async function toggleObrigacaoGlobal(el, obId) {
  const item = el.parentElement;
  const feito = !el.classList.contains('done');
  el.classList.toggle('done', feito);
  el.innerHTML = feito ? '✓' : '';
  item.classList.toggle('feito', feito);
  const criadoresAlvo = STATE.portal === 'operador'
    ? STATE.criadores.filter(c=>c.operador_id===STATE.userId && c.ativo)
    : STATE.criadores.filter(c=>c.ativo);
  try {
    await salvarRotinaParaCriadores(obId, feito, criadoresAlvo.map(c=>c.id));
    toast(feito ? 'Obrigação marcada como feita!' : 'Desmarcada','ok');
    if (STATE.currentPage) renderPage(STATE.currentPage);
  } catch (error) {
    el.classList.toggle('done', !feito);
    el.innerHTML = !feito ? '✓' : '';
    item.classList.toggle('feito', !feito);
    toast('Erro ao salvar rotina: '+error.message,'err');
  }
}

function statusBadge(s) {

async function atualizarStatusMidia(id, status) {

}

async function notificarCriador(criadorId, midiaId) {
  const mensagem = 'ATENCAO: voce tem midias pendentes para enviar esta semana. Prazo maximo: domingo.';
  let e1 = null;
  if (midiaId) {
    const resp = await sb.from('midias_status').update({notificado: true, updated_at: new Date().toISOString()}).eq('id', midiaId);
    e1 = resp.error;
  } else {
    try {
      await salvarOuAtualizarMidia({criador_id: criadorId, tipo:'rotineiro', status:'pendente', semana: inicioSemana(), notificado:true});
    } catch (error) {
      e1 = error;
    }
  }
  const { data: existente, error: eBusca } = await sb.from('notificacoes')
    .select('id')
    .eq('criador_id', criadorId)
    .eq('mensagem', mensagem)
    .eq('lida', false)
    .limit(1);
  const { error: e2 } = existente?.length ? { error: null } : await sb.from('notificacoes').insert({criador_id: criadorId, mensagem, prioritaria: true, lida: false});
  if (e1 || eBusca || e2) toast('Erro ao notificar','err');
  else { toast('Criador notificado!','ok'); renderPage(STATE.currentPage || 'midias'); }
}

async function criarNotificacaoCriador(criadorId, mensagem, prioritaria = true) {
  const { data: existente, error: eBusca } = await sb.from('notificacoes')
    .select('id')
    .eq('criador_id', criadorId)
    .eq('mensagem', mensagem)
    .eq('lida', false)
    .limit(1);
  if (eBusca) throw eBusca;
  if (existente?.length) return existente[0].id;
  const { data, error } = await sb.from('notificacoes')
    .insert({criador_id: criadorId, mensagem, prioritaria, lida: false})
    .select('id')
    .limit(1);
  if (error) throw error;
  return data?.[0]?.id;
}

async function salvarOuAtualizarMidia({criador_id, tipo, status, semana, notificado = false}) {
  const { data: atual, error: eBusca } = await sb.from('midias_status')
    .select('id,status')
    .eq('criador_id', criador_id)
    .eq('tipo', tipo)
    .eq('semana', semana)
    .limit(1);
  if (eBusca) throw eBusca;
  if (atual?.length) {
    const patch = {status, updated_at: new Date().toISOString()};
    if (notificado) patch.notificado = true;
    const { error } = await sb.from('midias_status')
      .update(patch)
      .eq('id', atual[0].id);
    if (error) throw error;
    return { updated: true, id: atual[0].id };
  }
  const { data, error } = await sb.from('midias_status')
    .insert({criador_id, tipo, status, semana, notificado})
    .select('id')
    .limit(1);
  if (error) throw error;
  return { updated: false, id: data?.[0]?.id };
}

      login: item.login || item.usuario || item.email || '',
      senha: item.senha || item.password || '',
      status: item.status || item.status_conta || 'ativa'
    })).filter(item => item.conta || item.login || item.senha);
  }
  if (typeof cofre === 'object') {
    return Object.entries(cofre).map(([conta, valor]) => {
      if (valor && typeof valor === 'object') {
        return {
          conta,
          login: valor.login || valor.usuario || valor.email || '',
          senha: valor.senha || valor.password || '',
          status: valor.status || valor.status_conta || 'ativa'
        };
      }
      return {conta, login:'', senha:String(valor || ''), status:'ativa'};
    }).filter(item => item.conta || item.login || item.senha);
  }
  return [];
}

async function salvarEditarOperador(id) {
  if (!requireAdmin('edição de operador e atribuições')) return;
  const nome = document.getElementById('eo-nome').value.trim();
  await sb.from('operadores').update({nome}).eq('id', id);
  const op = STATE.operadores.find(o=>o.id===id);
  if (op) op.nome = nome;

  // Atualizar atribuições
  const criadores = STATE.criadores.filter(c=>c.ativo);
  for (const cr of criadores) {
    const checked = document.querySelector(`input[type="checkbox"][value="${CSS.escape(cr.id)}"]`)?.checked;
    if (checked && cr.operador_id !== id) {
      await sb.from('criadores').update({operador_id: id}).eq('id', cr.id);
      cr.operador_id = id;
    } else if (!checked && cr.operador_id === id) {
      await sb.from('criadores').update({operador_id: null}).eq('id', cr.id);
      cr.operador_id = null;
    }
  }
  toast('Operador atualizado!','ok');
  closeModal();
  renderPage('equipe');
}

  if (!requireAdmin('remoção de operador')) return;

  await sb.from('operadores').update({ativo: false}).eq('id', id);
  STATE.operadores = STATE.operadores.filter(o=>o.id!==id);
  toast('Operador desativado','ok');
  renderPage('equipe');
}

async function garantirOnboardingPadrao(criadorId, passosAtuais = []) {
  const existentes = new Set((passosAtuais || []).map(p => String(p.passo || '').trim().toLowerCase()));
  const finalizado = passosAtuais?.some(p => p.finalizado) || false;
  if (finalizado) return passosAtuais || [];
  const novos = ONBOARDING_PADRAO
    .map((passo, idx) => ({passo, ordem: idx + 1}))
    .filter(p => !existentes.has(p.passo.toLowerCase()))
    .map(p => ({criador_id: criadorId, passo: p.passo, ordem: p.ordem, feito: false, finalizado: false}));
  if (novos.length) {
    const { error } = await sb.from('onboarding_status').insert(novos);
    if (error) throw error;
    const { data } = await sb.from('onboarding_status').select('*').eq('criador_id', criadorId).order('ordem');
    return data || passosAtuais || [];
  }
  return passosAtuais || [];
}

async function renderOnboarding() {
  const content = document.getElementById('content');
  const criadores = STATE.criadores.filter(c=>c.ativo);

  content.innerHTML = `<div>
    <div class="section-header">
      <div class="section-title">Onboarding</div>
      <button class="btn btn-primary" onclick="modalAddPassoOnboarding()">+ Adicionar Passo</button>
    </div>
    <div id="onboarding-content"></div>
  </div>`;

  const div = document.getElementById('onboarding-content');
  let renderizados = 0;
  for (const cr of criadores) {
    const { data: passosBase, error } = await sb.from('onboarding_status').select('*').eq('criador_id', cr.id).order('ordem');
    if (error) {
      div.innerHTML += `<div class="alerta-item alta"><div class="alerta-icon">!</div><div><div class="alerta-msg">Erro ao carregar onboarding de ${esc(cr.nome)}</div><div class="alerta-criador">${esc(error.message)}</div></div></div>`;
      continue;
    }
    const passos = await garantirOnboardingPadrao(cr.id, passosBase || []);
    const total = passos?.length || 0;
    const feitos = passos?.filter(p=>p.feito).length || 0;
    const finalizado = passos?.some(p=>p.finalizado) || false;
    if (finalizado) continue;
    renderizados++;

    div.innerHTML += `<div class="card mb-4" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(cr.nome)}</div>
          <div class="text-muted">${feitos}/${total} passos completos ${finalizado ? '✅ Finalizado' : ''}</div>
        </div>
        <div style="display:flex;gap:8px">
          ${!finalizado ? `<button class="btn btn-success btn-sm" onclick="finalizarOnboarding('${jsArg(cr.id)}')">✅ Finalizar</button>` : ''}
          <button class="btn btn-primary btn-sm" onclick="modalAddPassoOnboarding('${jsArg(cr.id)}')">+ Passo</button>
        </div>
      </div>
      <div class="progress mt-4"><div class="progress-fill" style="width:${total>0?Math.round(feitos/total*100):0}%"></div></div>
      <div style="margin-top:12px">
        ${passos?.map(p=>`<div class="rotina-item ${p.feito?'feito':''}">
          <div class="ri-check ${p.feito?'done':''}" onclick="togglePasso('${jsArg(p.id)}',${p.feito},this)">${p.feito?'✓':''}</div>
          <div class="ri-desc">${esc(p.passo)}</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-xs" onclick="modalEditarPassoOnboarding('${jsArg(p.id)}','${jsArg(p.passo)}','${p.ordem||1}')">Editar</button>
            <button class="btn btn-danger btn-xs" onclick="removerPasso('${jsArg(p.id)}')">✕</button>
          </div>
        </div>`).join('') || '<div class="text-muted">Nenhum passo cadastrado</div>'}
      </div>
    </div>`;
  }
  if (!renderizados) {
    div.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><div class="empty-msg">Nenhum onboarding ativo. Os finalizados ficam ocultos.</div></div>';
  }
}

async function salvarAdvertencia() {
  if (!requireAdmin('criação de advertências')) return;
  const criador_id = document.getElementById('adv-cr').value;
  const motivo = document.getElementById('adv-motivo').value.trim();
  const gravidade = document.getElementById('adv-grav').value;
  if (!motivo) { toast('Informe o motivo','warn'); return; }
  const { error } = await sb.from('advertencias').insert({criador_id, motivo, gravidade});
  if (error) { toast('Erro: '+error.message,'err'); return; }
  const mensagem = `Advertencia ${gravidade}: ${motivo}`;
  try {
    await criarNotificacaoCriador(criador_id, mensagem, gravidade !== 'baixa');
  } catch (e) {
    toast('Advertencia salva, mas notificacao nao foi criada: '+e.message,'warn');
  }
  toast('Advertencia registrada e enviada ao criador!','ok');
  closeModal();
  renderPage('advertencias');
}

// ============================================================
async function renderRelatorios() {
  const content = document.getElementById('content');
  const mes = mesAtual();
  const criadores = STATE.criadores.filter(c=>c.ativo);

  const { data: fatTotal } = await sb.from('faturamento').select('criador_id, valor, plataforma').eq('mes', mes);
  const { data: kpiTotal } = await sb.from('kpis_manuais').select('criador_id, valor, metrica, plataforma').eq('mes', mes);
  const { data: chamTodos } = await sb.from('chamados').select('status, criador_id');
  const { data: rotMes } = await sb.from('rotina_status').select('criador_id,feito').gte('data', mes+'-01');
  const resumoGeral = resumoIndicadores(fatTotal || [], kpiTotal || []);

  const fatPorCriador = {};
  fatTotal?.forEach(f => { fatPorCriador[f.criador_id] = (fatPorCriador[f.criador_id]||0) + Number(f.valor); });

  const fatPorPlat = {};
  fatTotal?.forEach(f => { fatPorPlat[f.plataforma] = (fatPorPlat[f.plataforma]||0) + Number(f.valor); });
  const chamadosAbertos = chamTodos?.filter(c => c.status !== 'resolvido').length || 0;
  const chamadosResolvidos = chamTodos?.filter(c => c.status === 'resolvido').length || 0;
  const resumosHoje = await Promise.all(criadores.map(c => resumoTarefasCriadorHoje(c.id)));
  const rotinaFeitas = resumosHoje.reduce((acc, r) => acc + r.feitas.length, 0);
  const rotinaTotal = resumosHoje.reduce((acc, r) => acc + r.total, 0);
  const midiasSemana = await Promise.all(criadores.map(c => resumoMidiasSemana(c.id)));
  const midiasPendentes = midiasSemana.filter(m => m.faltandoEnvio).length + midiasSemana.reduce((acc, m) => acc + m.pendentes.length, 0);

  content.innerHTML = `<div>
    <div class="section-header"><div class="section-title">Relatorios - ${esc(mes)}</div></div>
    <div class="card mb-4">
      <div class="card-title">Resumo geral de indicadores</div>
      ${resumoCardsHtml(resumoGeral, 'admin')}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Faturamento por Criador</div>
        ${criadores.map(c=>`<div class="fin-item">
          <div><div class="fin-tipo">${esc(c.nome)}</div></div>
          <div class="fin-val fin-entrada">${fmtBRL(fatPorCriador[c.id]||0)}</div>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title">Faturamento por Plataforma</div>
        ${Object.entries(fatPorPlat).map(([p,v])=>`<div class="fin-item">
          <div><div class="fin-tipo">${esc(p)}</div></div>
          <div class="fin-val fin-entrada">${fmtBRL(v)}</div>
        </div>`).join('') || '<div class="text-muted">Sem dados</div>'}
      </div>
    </div>
    <div class="card mt-4" style="margin-top:16px">
      <div class="card-title">Saude dos Projetos</div>
      <div id="rel-saude"></div>
    </div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">Entrega diaria de atividades</div>
        <div class="stats-grid" style="margin-bottom:0">
          <div class="stat-card"><div class="stat-label">Feitas hoje</div><div class="stat-val">${rotinaFeitas}</div></div>
          <div class="stat-card"><div class="stat-label">Total marcado</div><div class="stat-val">${rotinaTotal}</div></div>
          <div class="stat-card"><div class="stat-label">Pendentes</div><div class="stat-val">${Math.max(rotinaTotal-rotinaFeitas,0)}</div></div>
        </div>
        <div id="rel-atividades" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <div class="card-title">Entrega da equipe no mes</div>
        ${STATE.operadores.filter(o=>o.ativo).map(op=>{
          const ids = criadores.filter(c=>c.operador_id===op.id).map(c=>c.id);
          const marcacoes = (rotMes || []).filter(r=>ids.includes(r.criador_id));
          const feitas = marcacoes.filter(r=>r.feito).length;
          const posts = (kpiTotal || []).filter(k=>ids.includes(k.criador_id) && k.metrica === 'postagens').reduce((a,b)=>a+Number(b.valor||0),0);
          return `<div class="fin-item"><div><div class="fin-tipo">${esc(op.nome)}</div><div class="fin-desc">${ids.length} criador(es) · ${fmt(posts)} postagens</div></div><div class="fin-val">${feitas}/${marcacoes.length}</div></div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-title">Chamados e midias</div>
        <div class="fin-item"><div class="fin-tipo">Chamados abertos</div><div class="fin-val">${chamadosAbertos}</div></div>
        <div class="fin-item"><div class="fin-tipo">Chamados resolvidos</div><div class="fin-val">${chamadosResolvidos}</div></div>
        <div class="fin-item"><div class="fin-tipo">Midias pendentes</div><div class="fin-val">${midiasPendentes}</div></div>
      </div>
    </div>
  </div>`;

  const saudeDiv = document.getElementById('rel-saude');
  for (const cr of criadores) {
    const s = await calcularSaude(cr.id);
    saudeDiv.innerHTML += `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bor)">
      <div style="min-width:140px;font-weight:500">${esc(cr.nome)}</div>
      <div style="flex:1" class="saude-bar saude-${saudeClass(s.score)}"><div class="saude-fill" style="width:${s.score}%"></div></div>
      <div style="min-width:40px;text-align:right;font-weight:600">${s.score}%</div>
      ${saudeBadge(s.score)}
    </div>`;
  }

  const atividadesDiv = document.getElementById('rel-atividades');
  for (const cr of criadores) {
    const resumo = await resumoTarefasCriadorHoje(cr.id);
    atividadesDiv.innerHTML += `<div class="fin-item">
      <div><div class="fin-tipo">${esc(cr.nome)}</div><div class="fin-desc">${resumo.pendentes.length ? esc(resumo.pendentes.slice(0,2).map(t=>t.descricao).join(' · ')) : 'Tudo em dia'}</div></div>
      <div class="fin-val">${resumo.feitas.length}/${resumo.total}</div>
    </div>`;
  }
}

function atualizarPessoasSenhaAcesso() {
  const tipo = document.getElementById('senha-tipo')?.value || 'criador';
  const select = document.getElementById('senha-pessoa');
  if (!select) return;
  const lista = tipo === 'operador'
    ? STATE.operadores.filter(o => o.ativo)
    : STATE.criadores.filter(c => c.ativo);
  select.innerHTML = lista.length
    ? lista.map(p => `<option value="${attr(p.id)}">${esc(p.nome)}</option>`).join('')
    : '<option value="">Nenhuma pessoa ativa encontrada</option>';
}

async function salvarSenhaAcesso() {
  if (!requireAdmin('alteracao de senha de acesso')) return;
  const tipo = document.getElementById('senha-tipo')?.value;
  const pessoaId = document.getElementById('senha-pessoa')?.value;
  const senha = document.getElementById('senha-nova')?.value.trim();
  if (!['criador','operador'].includes(tipo)) { toast('Escolha criador ou operador.','warn'); return; }
  if (!pessoaId) { toast('Selecione uma pessoa.','warn'); return; }
  if (!senha || senha.length < 4) { toast('A senha precisa ter pelo menos 4 caracteres.','warn'); return; }

  const lista = tipo === 'operador' ? STATE.operadores : STATE.criadores;
  const pessoa = lista.find(p => p.id === pessoaId);
  if (!pessoa) { toast('Pessoa nao encontrada no CRM.','err'); return; }

  const payload = {
    tipo,
    pessoa_id: pessoa.id,
    nome: pessoa.nome,
    senha,
    ativo: true,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('acessos_crm').upsert(payload, { onConflict: 'tipo,pessoa_id' });
  if (error) {
    toast('Erro ao salvar senha. Confira se o SQL de acessos foi rodado no Supabase.','err');
    return;
  }
  document.getElementById('senha-nova').value = '';
  toast('Senha de acesso atualizada!','ok');
}

  if (!confirm(`Executar reset de ${mes}? Isso apaga apenas dados alimentados neste mês.`)) return;
  if (!confirm('Confirmar reset mensal? Esta ação não mexe em meses anteriores.')) return;

  const operacoes = [
    sb.from('faturamento').delete().eq('mes', mes),
    sb.from('kpis_manuais').delete().eq('mes', mes),
    sb.from('financeiro_interno').delete().eq('mes', mes),

    sb.from('notificacoes').delete().gte('created_at', inicio),

    sb.from('advertencias').update({ativo:false}).gte('created_at', inicio),

    try {
      await fn();

    } catch(e) {
      resultados.push({nome, ok: false, erro: e.message});
    }
  }

  await testar('Carregar admins', async () => {
    const {data,error} = await sb.from('admins').select('*').limit(1);
    if (error) throw error;
    if (!data) throw new Error('Sem dados');
  });
  await testar('Carregar operadores', async () => {

    if (error) throw error;
  });
  await testar('Carregar criadores', async () => {
    const {data,error} = await sb.from('criadores').select('*').limit(1);
    if (error) throw error;
  });
  await testar('Carregar obrigações', async () => {
    const {data,error} = await sb.from('obrigacoes').select('*').limit(1);
    if (error) throw error;
  });
  await testar('Ler faturamento', async () => {
    const {error} = await sb.from('faturamento').select('id,criador_id,valor,mes').limit(1);
    if (error) throw error;

    const {error} = await sb.from('kpis_manuais').select('id,criador_id,plataforma,metrica,valor,mes').limit(1);
    if (error) throw error;
  });
  await testar('Ler chamados', async () => {
    const {error} = await sb.from('chamados').select('id,criador_id,titulo,status').limit(1);
    if (error) throw error;
  });
  await testar('Ler dossiê', async () => {
    const {error} = await sb.from('dossies').select('*').limit(1);
    if (error) throw error;
  });
  await testar('Ler financeiro interno', async () => {
    const {error} = await sb.from('financeiro_interno').select('id,tipo,valor,mes').limit(1);
    if (error) throw error;
  });
  await testar('Ler notificações', async () => {
    const {error} = await sb.from('notificacoes').select('id,criador_id,mensagem,lida').limit(1);
    if (error) throw error;
  });
  await testar('Ler logs extras', async () => {
    const {error} = await sb.from('logs_extra').select('id,operador_id,criador_id,mensagem').limit(1);
    if (error) throw error;
  });
  await testar('Ler leads', async () => {
    const {error} = await sb.from('leads').select('id,nome,etapa').limit(1);
    if (error) throw error;
  });
  await testar('Ler config CRM', async () => {
    const {error} = await sb.from('crm_config').select('*').limit(1);
    if (error) throw error;
  });
  await testar('Gerador de alertas', async () => {

    if (!Array.isArray(alertas)) throw new Error('Não retornou array');
  });
  await testar('Cálculo de saúde', async () => {
    const s = await calcularSaude('cr01');
    if (typeof s.score !== 'number') throw new Error('Score inválido');
  });

  const ok = resultados.filter(r=>r.ok).length;

  div.innerHTML = `<div style="margin-bottom:12px">

      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

async function salvarRegistroPostagens() {
  const criador_id = document.getElementById('rp-cr')?.value;
  const plataforma = document.getElementById('rp-plat')?.value;
  const quantidade = parseInt(document.getElementById('rp-qtd')?.value, 10);
  const observacao = document.getElementById('rp-obs')?.value.trim() || null;
  if (!criador_id) { toast('Nenhum criador atribuído para registrar postagens','warn'); return; }
  if (!plataforma) { toast('Selecione a plataforma','warn'); return; }
  if (Number.isNaN(quantidade) || quantidade < 0) { toast('Informe a quantidade de postagens','warn'); return; }
  const cr = STATE.criadores.find(c => c.id === criador_id);
  if (!cr || cr.operador_id !== STATE.userId) { toast('Criador não pertence a este operador','err'); return; }
  const payload = {
    operador_id: STATE.userId,
    criador_id,
    plataforma,
    quantidade,
    observacao,
    data: hoje(),
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('postagens_diarias')
    .upsert(payload, { onConflict: 'operador_id,criador_id,plataforma,data' });
  if (error) { toast('Erro ao salvar registro: '+error.message,'err'); return; }
  toast('Registro de postagens salvo!','ok');
  renderPage('op-rotina');
}

async function salvarFaturamento(criadorId) {

  toast(`Faturamento lançado! +${fmtBRL(valor)}`,'ok');
  closeModal();
  if (STATE.currentPage) renderPage(STATE.currentPage);
}

    </div>

     <button class="btn btn-primary" onclick="salvarKpi('${criadorId}')">Salvar</button>`
  );

function labelMetrica(metrica) {
  return {
    seguidores:'Seguidores',
    visualizacoes:'Visualizações',
    postagens:'Postagens feitas',
    assinantes:'Assinantes',
    vendas_avulsas:'Vendas avulsas',
    engajamento:'Engajamento'
  }[normalizarMetrica(metrica)] || metrica;
}
function atualizarMetricasKpi() {
  const plataforma = document.getElementById('kpi-plat')?.value;
  const select = document.getElementById('kpi-met');
  if (!select) return;
  select.innerHTML = metricasDaPlataforma(plataforma).map(m => `<option value="${attr(m)}">${esc(labelMetrica(m))}</option>`).join('');
}

async function salvarKpi(criadorId) {
  if (!requireAdmin('alimentação de KPIs oficiais')) return;
  const plataforma = plataformaCanonica(document.getElementById('kpi-plat').value);
  const metrica = normalizarMetrica(document.getElementById('kpi-met').value);
  const valor = parseFloat(document.getElementById('kpi-val').value);
  const data = document.getElementById('kpi-data').value;
  if (!valor) { toast('Informe o valor','warn'); return; }
  if (!metricasDaPlataforma(plataforma).includes(metrica)) {
    toast('Métrica incompatível com esta plataforma','warn');
    return;
  }
  const { error } = await sb.from('kpis_manuais').insert({criador_id: criadorId, plataforma, metrica, valor, data, mes: (data || hoje()).slice(0,7)});
  if (error) { toast('Erro: '+error.message,'err'); return; }
  toast('KPI salvo!','ok');
  closeModal();
  if (STATE.currentPage) renderPage(STATE.currentPage);
}

  const rotinaHoje = rotinaDoDia(obrigacoes, diaHoje, ['criador','admin_criador','todos']);

  // Status existentes hoje
  const { data: statusHoje } = await sb.from('rotina_status').select('*').eq('criador_id', id).eq('data', hoje());

  content.innerHTML = `<div>
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px">Minhas Tarefas de Hoje</div>
    ${rotinaHoje.length === 0 ? '<div class="empty"><div class="empty-icon">🎉</div><div class="empty-msg">Nenhuma tarefa para hoje. Boa folga!</div></div>' : ''}
    <div id="cr-tarefas-lista"></div>
  </div>`;

  const lista = document.getElementById('cr-tarefas-lista');
  for (const ob of rotinaHoje) {
    const statusExistente = statusHoje?.find(s=>s.obrigacao_id===ob.id);
    const feito = statusExistente?.feito || false;
    const el = document.createElement('div');
    el.className = `rotina-item ${feito?'feito':''}`;
    el.innerHTML = `<div class="ri-check ${feito?'done':''}" onclick="toggleTarefaCriador(this,'${jsArg(ob.id)}','${jsArg(statusExistente?.id||'')}',${feito})">${feito?'✓':''}</div>
      <div><div class="ri-desc">${esc(ob.descricao)}</div></div>`;
    lista.appendChild(el);
  }
}

async function toggleTarefaCriador(el, obId, statusId, atual) {
  const novo = !atual;
  const item = el.parentElement;
  el.classList.toggle('done', novo);
  el.innerHTML = novo ? '✓' : '';
  item.classList.toggle('feito', novo);

  if (statusId) {
    await sb.from('rotina_status').update({feito: novo}).eq('id', statusId);
  } else {
    const { data, error } = await sb.from('rotina_status')
      .insert({criador_id: STATE.userId, obrigacao_id: obId, feito: novo, data: hoje()})
      .select('id')
      .limit(1);
    if (error) {
      toast('Erro ao salvar tarefa: '+error.message,'err');
      return;
    }
    if (data?.[0]) el.setAttribute('onclick', `toggleTarefaCriador(this,'${jsArg(obId)}','${jsArg(data[0].id)}',${novo})`);
  }
  toast(novo ? 'Tarefa concluída! ✓' : 'Desmarcada','ok');
}

async function renderCrMidias() {
  const content = document.getElementById('content');
  const id = STATE.userId;
  const { data: midias } = await sb.from('midias_status').select('*').eq('criador_id', id).gte('semana', inicioSemana());

  content.innerHTML = `<div>
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px">Minhas Mídias desta Semana</div>
    <div class="alerta-item media"><div class="alerta-icon">⏰</div><div><div class="alerta-msg">Prazo máximo para envio do banco de mídias: domingo.</div><div class="alerta-criador">Marque abaixo assim que enviar suas mídias.</div></div></div>
    ${midias?.map(m=>`<div class="rotina-item">
      <div style="flex:1"><div class="ri-desc">${m.tipo==='rotineiro'?'📌 Conteúdo Rotineiro':m.tipo==='ideia'?'💡 Ideia de Conteúdo':'🔞 Mídia +18'}</div></div>
      ${statusBadge(m.status)}
    </div>`).join('') || '<div class="empty"><div class="empty-icon">🎬</div><div class="empty-msg">Nenhuma mídia lançada esta semana</div></div>'}
    <div class="sep"></div>
    <div style="font-size:14px;font-weight:500;margin-bottom:12px">Marcar envio de mídia</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-primary" onclick="marcarMidia('rotineiro')" style="width:100%;justify-content:center;padding:14px">📌 Enviei Conteúdo Rotineiro</button>
      <button class="btn btn-secondary" onclick="marcarMidia('ideia')" style="width:100%;justify-content:center;padding:14px">💡 Enviei Ideia de Conteúdo</button>
      <button class="btn btn-secondary" onclick="marcarMidia('adulto')" style="width:100%;justify-content:center;padding:14px">🔞 Enviei Mídia +18</button>
    </div>
  </div>`;
}

async function marcarMidia(tipo) {
  try {
    await salvarOuAtualizarMidia({criador_id: STATE.userId, tipo, status: 'enviado', semana: inicioSemana()});
    toast('Mídia marcada como enviada!','ok');
    renderPage('cr-midias');
  } catch (error) {
    toast('Erro ao salvar mídia: '+error.message,'err');
  }
}

async function renderCrPendencias() {
  const content = document.getElementById('content');
  const id = STATE.userId;
  const [notifResp, advResp] = await Promise.all([
    sb.from('notificacoes').select('*').eq('criador_id', id).eq('lida', false).order('prioritaria',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('advertencias').select('*').eq('criador_id', id).eq('ativo', true).order('created_at',{ascending:false}),
  ]);
  const notifs = notifResp.data || [];
  const advertencias = advResp.data || [];

  content.innerHTML = `<div>
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px">Minhas Pendências</div>
    ${(notifs.length + advertencias.length) === 0 ? '<div class="empty"><div class="empty-icon">✓</div><div class="empty-msg">Nenhuma pendencia! Tudo certo.</div></div>' : ''}
    ${advertencias.length ? `<div class="card mb-4" style="border-left:6px solid var(--err);background:var(--err2)">
      <div class="card-title" style="color:var(--err)">Advertencias ativas</div>
      ${advertencias.map(a=>`<div class="notif-item prioritaria" style="margin-bottom:8px">
        <div class="notif-msg">${esc(a.motivo)} <span class="badge badge-${a.gravidade==='alta'?'err':a.gravidade==='media'?'warn':'info'}">${esc(a.gravidade)}</span></div>
      </div>`).join('')}
    </div>` : ''}
    <div id="pend-lista"></div>
  </div>`;

  const lista = document.getElementById('pend-lista');
  notifs.forEach(n => {
    lista.innerHTML += `<div class="notif-item ${n.prioritaria?'prioritaria':''}">
      <div class="notif-msg">${n.prioritaria?'⚠️ ':''} ${esc(n.mensagem)}</div>
      <button class="btn btn-success btn-sm" onclick="marcarNotifLida('${jsArg(n.id)}')">✓ Ok</button>
    </div>`;
  });
}

async function marcarNotifLida(id) {
  await sb.from('notificacoes').update({lida: true}).eq('id', id);
  toast('Marcado como resolvido!','ok');
  renderPage('cr-pendencias');
}

async function renderCrChamados() {
  const content = document.getElementById('content');
  const id = STATE.userId;
  const { data: chamados } = await sb.from('chamados').select('*').eq('criador_id', id).order('created_at', {ascending:false});

  content.innerHTML = `<div>
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px">Meus Chamados</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;margin-bottom:16px" onclick="modalCrNovoChamado()">+ Abrir Chamado</button>
    ${chamados?.map(c=>`<div class="chamado-item">
      <div class="chamado-header">
        <div class="chamado-titulo">${esc(c.titulo)}</div>
        ${statusBadge(c.status)}
      </div>
      <div class="chamado-meta">${fmtDate(c.created_at?.split('T')[0])}</div>
      ${c.descricao ? `<div style="font-size:12px;color:var(--tx3);margin-top:6px">${esc(c.descricao)}</div>` : ''}
    </div>`).join('') || '<div class="empty"><div class="empty-icon">💬</div><div class="empty-msg">Nenhum chamado aberto</div></div>'}
  </div>`;
}

function modalCrNovoChamado() {
  openModal('Abrir Chamado', `
    <div class="form-group"><label class="form-label">O que aconteceu?</label><input id="cr-ch-titulo" placeholder="Resumo do problema"></div>
    <div class="form-group"><label class="form-label">Mais detalhes</label><textarea id="cr-ch-desc" placeholder="Explique com mais detalhes (opcional)"></textarea></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarCrChamado()">Enviar</button>`
  );
}

async function salvarCrChamado() {
  const titulo = document.getElementById('cr-ch-titulo').value.trim();
  const descricao = document.getElementById('cr-ch-desc').value.trim();
  if (!titulo) { toast('Informe o problema','warn'); return; }
  await sb.from('chamados').insert({criador_id: STATE.userId, titulo, descricao, aberto_por: STATE.userName, status: 'aberto'});
  toast('Chamado enviado!','ok');
  closeModal();
  renderPage('cr-chamados');
}

// ============================================================
// BOOT
// ============================================================
boot();
</script>
</body>
</html>
