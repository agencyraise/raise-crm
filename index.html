<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--soft:#eef0f6;--line:#dfe2eb;--text:#16182a;--muted:#6b7087;--weak:#9ca2b8;--brand:#6c5ce7;--brand2:#eeeaff;--ok:#00a878;--okb:#e8faf4;--warn:#f59e0b;--warnb:#fff4d6;--bad:#e11d48;--badb:#ffe4eb;--blue:#1d72b8;--blueb:#e9f3fc;--r:10px;--font:'Inter',sans-serif;--head:'Syne',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:62px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:5}.brand{font-family:var(--head);font-size:22px;font-weight:800;margin-right:8px}.brand span{color:var(--brand)}.portal-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:20px;padding:8px 15px;font-weight:800}.portal-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}.clock{margin-left:auto;color:var(--weak);font-weight:700;font-size:13px}
.app-error{display:none;background:var(--badb);border:1px solid #f8a8ba;color:var(--bad);padding:10px 14px;font-weight:800}
.app-error.on{display:block}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}.side-title{font-family:var(--head);font-size:16px;font-weight:800;margin:8px 10px 2px}.side-sub{color:var(--weak);font-size:11px;margin:0 10px 16px;text-transform:uppercase;letter-spacing:.06em}.nav-sec{color:var(--weak);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:16px 10px 6px}.nav{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;font-weight:700;margin-bottom:2px}.nav:hover,.nav.on{background:var(--brand2);color:var(--brand)}
.main{padding:20px;min-width:0}.screen{display:none}.screen.on{display:block}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}.title{font-family:var(--head);font-size:28px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}.metric b{font-family:var(--head);font-size:26px;display:block}.metric span{color:var(--weak);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}.card-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.card-t{font-family:var(--head);font-weight:800}.card-b{padding:14px}.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;align-items:center;border-radius:20px;padding:4px 9px;font-weight:800;font-size:11px}.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:#8a5400}.bad{background:var(--badb);color:var(--bad)}.info{background:var(--brand2);color:var(--brand)}.blue{background:var(--blueb);color:var(--blue)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 12px;font-weight:800}.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}.btn.r{background:var(--bad);border-color:var(--bad);color:#fff}.btn.s{padding:5px 8px;font-size:12px}.input,.select,.area{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;color:var(--text)}.area{min-height:80px;resize:vertical}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:var(--weak);text-transform:uppercase;letter-spacing:.05em;font-weight:800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.on{display:flex}.box{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border-radius:14px;border:1px solid var(--line);padding:18px}.box h3{font-family:var(--head);margin:0 0 14px}.bar{height:9px;background:var(--soft);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;z-index:30}.toast.on{display:block}.table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px;font-size:13px}.table th{color:var(--weak);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.clean-creator{max-width:920px;margin:auto}.big-action{padding:14px;border-radius:12px;font-size:15px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;gap:4px}.side-title,.side-sub,.nav-sec{display:none}.nav{white-space:nowrap}.main{padding:14px}.g2,.g3,.g4{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.top{overflow:auto}.clock{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Raise<span>Hot</span></div>
  <button class="portal-btn on" data-portal="adm">Admin</button>
  <button class="portal-btn" data-portal="ope">Operador</button>
  <button class="portal-btn" data-portal="cri">Criador</button>
  <div class="clock" id="clock"></div>
</div>
<div class="app-error" id="app-error"></div>
<div class="layout">
  <aside class="side">
    <div class="side-title">CRM V3</div>
    <div class="side-sub">Sem login/senha</div>
    <div id="nav"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal"><div class="box"><h3 id="modal-title"></h3><div id="modal-body"></div></div></div>

<script>
const SUPABASE_URL='https://jgqetqltkmokkbbnoxts.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_FZbMpNFtR90ysZcLkoj-sQ_9_CSZv3Q';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>new Date();
const pad=n=>String(n).padStart(2,'0');
const diaKey=(d=today())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mesKey=(d=today())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const semanaKey=(d=today())=>{const first=new Date(d.getFullYear(),d.getMonth(),1);const w=Math.ceil((d.getDate()+first.getDay())/7);return `${mesKey(d)}-S${w}`};
const semanaNum=(d=today())=>Number(semanaKey(d).split('S')[1]);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const compact=n=>{n=Number(n||0);if(Math.abs(n)>=1000000)return (n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'Ml';if(Math.abs(n)>=1000)return (n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k';return n.toLocaleString('pt-BR')};
const uid=p=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
const byId=(arr,id)=>arr.find(x=>x.id===id)||{};
const active=x=>x.ativo!==false;
const emptyK={fatMes:{},fatSem:{},kpiMes:{},rotina:{},midias:{},saude:{},motivos:{},receita:0,exec:0,alertas:0};
const state={portal:'adm',screen:'dash',operador:'cl01',criador:'cr01',k:{...emptyK},db:{operadores:[],criadores:[],obrigacoes:[],rotina_status:[],midias_status:[],faturamento:[],kpis_manuais:[],plataformas_status:[],chamados:[],financeiro_interno:[],advertencias:[],notificacoes:[],logs_extra:[],leads:[],onboarding_status:[],dossies:[],crm_config:[]}};

const NAV={
 adm:[['Visão geral','dash','Dashboard'],['Operação','projetos','Projetos'],['Operação','alertas','Alertas'],['Operação','rotina','Rotina semanal'],['Operação','onboarding','Onboarding'],['Operação','midias','Mídias'],['Operação','chamados','Chamados'],['Gestão','dossie','Dossiê'],['Gestão','financeiro','Financeiro'],['Gestão','interno','Controle interno'],['Gestão','equipe','Equipe'],['Gestão','crm','Gestão do CRM']],
 ope:[['Colaborador','opHome','Minha rotina'],['Colaborador','opCriadores','Meus criadores'],['Colaborador','opMidias','Mídias'],['Colaborador','opChamados','Chamados'],['Colaborador','opDossie','Dossiê'],['Colaborador','opLogs','Log extra']],
 cri:[['Criador','crHome','Visão geral'],['Criador','crTarefas','Minhas tarefas'],['Criador','crMidias','Enviar mídias'],['Criador','crPend','Pendências'],['Criador','crChamados','Chamados']]
};

function errMsg(e){return e?.message||e?.details||String(e||'Erro desconhecido')}
function showError(msg){const el=$('app-error');if(!el)return;el.textContent=msg;el.classList.add('on')}
function clearError(){const el=$('app-error');if(el)el.classList.remove('on')}
async function dbGet(table){const {data,error}=await sb.from(table).select('*');if(error){console.warn(table,error.message);return []}return data||[]}
async function dbUpsert(table,row){const {data,error}=await sb.from(table).upsert(row).select();if(error)throw error;return data?.[0]}
async function dbInsert(table,row){const {data,error}=await sb.from(table).insert(row).select();if(error)throw error;return data?.[0]}
async function dbUpdate(table,id,row){let res=await sb.from(table).update({...row,updated_at:new Date().toISOString()}).eq('id',id).select();if(res.error&&/updated_at/i.test(res.error.message||''))res=await sb.from(table).update(row).eq('id',id).select();if(res.error)throw res.error;return res.data?.[0]}
async function dbDelete(table,id){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
function openModal(title,html){$('modal-title').textContent=title;$('modal-body').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

async function load(){
 const tables=Object.keys(state.db);
 const values=await Promise.all(tables.map(dbGet));
 tables.forEach((t,i)=>state.db[t]=values[i]);
 ensureSelection();
 calc();
 render();
}
async function safeLoad(){
 try{await load();clearError()}
 catch(e){showError('Erro ao carregar o CRM: '+errMsg(e));console.error(e)}
}
function ensureSelection(){
 const ops=state.db.operadores.filter(active); const cris=state.db.criadores.filter(active);
 if(!ops.some(o=>o.id===state.operador))state.operador=ops[0]?.id||'';
 if(!cris.some(c=>c.id===state.criador))state.criador=cris[0]?.id||'';
}
function calc(){
 const d=state.db, mk=mesKey(), sk=semanaKey(), dk=diaKey(), day=String(today().getDay());
 const cris=d.criadores.filter(active), obs=d.obrigacoes.filter(o=>active(o)&&(o.dia==='todos'||o.dia===day));
 const fatMes={}, fatSem={}, kpiMes={}, rotina={}, midias={};
 d.faturamento.forEach(f=>{if(f.mes_key===mk)fatMes[f.criador_id]=(fatMes[f.criador_id]||0)+Number(f.total||0);if(f.semana_key===sk)fatSem[f.criador_id]=(fatSem[f.criador_id]||0)+Number(f.total||0)});
 d.kpis_manuais.forEach(k=>{if(k.mes_key===mk){const a=kpiMes[k.criador_id]||{seguidores:0,visualizacoes:0,assinantes:0,engajamento:0};a.seguidores+=Number(k.seguidores||0);a.visualizacoes+=Number(k.visualizacoes||0);a.assinantes+=Number(k.assinantes||0);a.engajamento+=Number(k.engajamento||0);kpiMes[k.criador_id]=a}});
 cris.forEach(c=>{const total=obs.length;const feitos=obs.filter(o=>d.rotina_status.some(r=>r.criador_id===c.id&&r.obrigacao_id===o.id&&r.dia_key===dk&&r.feito)).length;rotina[c.id]=total?Math.round(feitos/total*100):100;const tipos=['rotineiro','ideias','adulto'];midias[c.id]=tipos.filter(tp=>d.midias_status.some(m=>m.criador_id===c.id&&m.tipo===tp&&m.semana_key===sk&&m.feito)).length});
 const saude={}; const motivos={};
 cris.forEach(c=>{let s=45;let m=[];if(rotina[c.id]>=80)s+=25;else m.push('rotina baixa');if((fatMes[c.id]||0)>0)s+=15;else m.push('sem faturamento no mês');if(midias[c.id]>=3)s+=15;else m.push('mídias pendentes');const ab=d.chamados.filter(ch=>ch.criador_id===c.id&&ch.status!=='resolvido').length;if(ab){s-=Math.min(20,ab*8);m.push(`${ab} chamado(s) aberto(s)`)}saude[c.id]=Math.max(0,Math.min(100,s));motivos[c.id]=m});
 state.k={fatMes,fatSem,kpiMes,rotina,midias,saude,motivos,receita:Object.values(fatMes).reduce((a,b)=>a+b,0),exec:cris.length?Math.round(Object.values(rotina).reduce((a,b)=>a+b,0)/cris.length):0,alertas:cris.filter(c=>saude[c.id]<70).length};
}

function render(){
 renderNav();
 const screen=state.screen;
 const map={dash:adminDash,projetos:adminProjetos,alertas:adminAlertas,rotina:adminRotina,onboarding:adminOnboarding,midias:adminMidias,chamados:adminChamados,dossie:adminDossie,financeiro:adminFinanceiro,interno:adminInterno,equipe:adminEquipe,crm:adminCRM,opHome:opHome,opCriadores:opCriadores,opMidias:opMidias,opChamados:opChamados,opDossie:opDossie,opLogs:opLogs,crHome:crHome,crTarefas:crTarefas,crMidias:crMidias,crPend:crPend,crChamados:crChamados};
 $('main').innerHTML=(map[screen]||adminDash)();
 bindScreenControls();
}
function renderNav(){
 const items=NAV[state.portal], nav=$('nav');let last='';
 nav.innerHTML=items.map(([sec,id,label])=>{let h=sec!==last?`<div class="nav-sec">${sec}</div>`:'';last=sec;return h+`<button class="nav ${state.screen===id?'on':''}" data-screen="${id}">${label}</button>`}).join('');
 nav.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;render()});
}
document.querySelectorAll('.portal-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.portal-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.portal=b.dataset.portal;state.screen=NAV[state.portal][0][1];render()});

function head(title,sub,actions=''){return `<div class="page-head"><div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function metric(v,l,cls=''){return `<div class="metric"><b class="${cls}">${v}</b><span>${l}</span></div>`}
function opName(id){return byId(state.db.operadores,id).nome||'Sem responsável'}
function crName(id){return byId(state.db.criadores,id).nome||'Criador'}
function statusPill(s){return `<span class="pill ${s==='resolvido'?'ok':s==='andamento'?'warn':s==='urgente'?'bad':'info'}">${esc(s||'aberto')}</span>`}
function saudePill(v){return `<span class="pill ${v>=75?'ok':v>=60?'warn':'bad'}">${v>=75?'Saudável':v>=60?'Atenção':'Crise'} ${v}%</span>`}
function selectCri(id='sel-cri',current=state.criador){return `<select class="select" id="${id}">${state.db.criadores.filter(active).map(c=>`<option value="${c.id}" ${c.id===current?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>`}
function selectOp(id='sel-op',current=state.operador){return `<select class="select" id="${id}">${state.db.operadores.filter(active).map(o=>`<option value="${o.id}" ${o.id===current?'selected':''}>${esc(o.nome)}</option>`).join('')}</select>`}
function bindScreenControls(){
 const bindings=[
  ['dossieSel','criador'],
  ['opPick','operador'],
  ['opPick2','operador'],
  ['crPick','criador']
 ];
 bindings.forEach(([id,key])=>{
  const el=$(id);
  if(el)el.onchange=()=>{state[key]=el.value;calc();render()};
 });
}

function adminDash(){
 const cris=state.db.criadores.filter(active), chamados=state.db.chamados.filter(c=>c.status!=='resolvido').length;
 return head('Dashboard','Visão geral do CRM aberto e conectado ao Supabase')+
 `<div class="metrics">${metric(cris.length,'Projetos ativos','info')}${metric(state.k.exec+'%','Execução geral',state.k.exec>=75?'ok':'warn')}${metric(state.k.alertas,'Alertas','bad')}${metric(money(state.k.receita),'Receita do mês','ok')}${metric(chamados,'Chamados abertos','warn')}</div>
 <div class="card"><div class="card-h"><div class="card-t">Saúde dos projetos</div></div><div class="card-b">${cris.map(c=>`<div class="row"><b class="grow">${esc(c.nome)}</b><span class="muted small">${esc(opName(c.operador_id))}</span>${saudePill(state.k.saude[c.id]||0)}</div>`).join('')||empty('Nenhum criador cadastrado.')}</div></div>`;
}
function adminProjetos(){return head('Projetos','Criadores, responsáveis, saúde e motivo da classificação',`<button class="btn p" onclick="modalCriador()">+ Criador</button>`)+state.db.criadores.filter(active).map(c=>`<div class="card"><div class="card-h"><div><div class="card-t">${esc(c.nome)}</div><div class="muted small">Responsável: ${esc(opName(c.operador_id))}</div></div>${saudePill(state.k.saude[c.id]||0)}</div><div class="card-b"><div class="row"><span class="grow">Faturamento mês</span><b>${money(state.k.fatMes[c.id]||0)}</b></div><div class="row"><span class="grow">Execução rotina</span><b>${state.k.rotina[c.id]||0}%</b></div><div class="row"><span class="grow">Motivo</span><span class="muted">${(state.k.motivos[c.id]||[]).join(', ')||'Tudo estável'}</span></div></div></div>`).join('')}
function adminAlertas(){const cris=state.db.criadores.filter(c=>active(c)&&(state.k.saude[c.id]||0)<70);return head('Alertas','Gerados pela saúde, rotina, mídia, faturamento e chamados')+(cris.map(c=>`<div class="card"><div class="card-b"><div class="row"><b class="grow">${esc(c.nome)}</b>${saudePill(state.k.saude[c.id]||0)}</div><div class="muted">${(state.k.motivos[c.id]||[]).join(', ')}</div></div></div>`).join('')||empty('Nenhum alerta crítico agora.'))}
function adminRotina(){const day=String(today().getDay()), obs=state.db.obrigacoes.filter(o=>active(o)&&(o.dia==='todos'||o.dia===day));return head('Rotina semanal','Mostra apenas obrigações do dia atual')+state.db.criadores.filter(active).map(c=>`<div class="card"><div class="card-h"><div class="card-t">${esc(c.nome)}</div><span class="pill info">${state.k.rotina[c.id]||0}%</span></div><div class="card-b">${obs.map(o=>checkRow(c.id,o)).join('')||empty('Sem obrigações hoje.')}</div></div>`).join('')}
function checkRow(cri,o){const r=state.db.rotina_status.find(x=>x.criador_id===cri&&x.obrigacao_id===o.id&&x.dia_key===diaKey());return `<div class="row"><span class="grow">${esc(o.nome)}</span><span class="pill ${r?.feito?'ok':'warn'}">${r?.feito?'feito':'pendente'}</span><button class="btn s" onclick="toggleRotina('${cri}','${o.id}')">${r?.feito?'Desfazer':'Feito'}</button></div>`}
function adminOnboarding(){return head('Onboarding','Passos editáveis por criador')+state.db.criadores.filter(active).map(c=>{const ob=state.db.onboarding_status.find(o=>o.criador_id===c.id);const passos=ob?.passos||['Contrato assinado','Dossiê preenchido','Plataformas conferidas','Primeira rotina concluída'];return `<div class="card"><div class="card-h"><div class="card-t">${esc(c.nome)}</div><div class="actions"><span class="pill ${ob?.finalizado?'ok':'warn'}">${ob?.finalizado?'finalizado':'em aberto'}</span><button class="btn s" onclick="modalOnboarding('${c.id}')">Editar passos</button></div></div><div class="card-b">${passos.map((p,i)=>`<div class="row"><span class="grow">${esc(p.texto||p)}</span><span class="pill ${(p.feito)?'ok':'info'}">${p.feito?'feito':'aberto'}</span><button class="btn s" onclick="toggleOnboardingPasso('${c.id}',${i})">${p.feito?'Desfazer':'Feito'}</button></div>`).join('')}<button class="btn g" onclick="finalizarOnboarding('${c.id}')">Finalizar onboarding</button></div></div>`}).join('')}
function adminMidias(){return head('Mídias','Controle semanal de entregas')+midiasList(state.db.criadores.filter(active))}
function adminChamados(){return head('Chamados','Abertos por admin, operador ou criador',`<button class="btn p" onclick="modalChamado()">+ Chamado</button>`)+chamadosList(state.db.chamados)}
function adminDossie(){return head('Dossiê','Informações editáveis dos criadores',`<button class="btn p" onclick="modalDossie()">Editar dossiê</button>`)+selectCri('dossieSel')+dossieCard(state.criador)}
function adminFinanceiro(){return head('Financeiro','Faturamento por criador e plataforma',`<button class="btn p" onclick="modalFaturamento()">+ Faturamento</button><button class="btn" onclick="modalKPI()">+ KPI social</button>`)+financeiroResumo()}
function adminInterno(){return head('Controle interno','Entradas, saídas e saldo do mês',`<button class="btn p" onclick="modalInterno()">+ Lançamento</button>`)+internoResumo()}
function adminEquipe(){return head('Equipe','Operadores, criadores atribuídos e remoção segura',`<button class="btn p" onclick="modalOperador()">+ Operador</button>`)+`<div class="card"><div class="card-b">${state.db.operadores.filter(active).map(o=>`<div class="row"><b class="grow">${esc(o.nome)}</b><span class="muted">${state.db.criadores.filter(c=>active(c)&&c.operador_id===o.id).length} criadores</span><button class="btn s" onclick="modalOperador('${o.id}')">Editar</button><button class="btn r s" onclick="removerOperador('${o.id}')">Remover</button></div>`).join('')}</div></div>`}
function adminCRM(){return head('Gestão do CRM','Cadastros principais e reset mensal',`<button class="btn r" onclick="resetMes()">Reset mês atual</button>`)+`<div class="grid g2"><div class="card"><div class="card-h"><div class="card-t">Criadores</div><button class="btn s" onclick="modalCriador()">Adicionar</button></div><div class="card-b">${state.db.criadores.filter(active).map(c=>`<div class="row"><span class="grow">${esc(c.nome)}</span><button class="btn s" onclick="modalCriador('${c.id}')">Editar</button><button class="btn r s" onclick="removerCriador('${c.id}')">Remover</button></div>`).join('')}</div></div><div class="card"><div class="card-h"><div class="card-t">Obrigações</div><button class="btn s" onclick="modalObrigacao()">Adicionar</button></div><div class="card-b">${state.db.obrigacoes.filter(active).map(o=>`<div class="row"><span class="grow">${esc(o.nome)}</span><span class="pill info">${esc(o.responsavel)}</span><button class="btn s" onclick="modalObrigacao('${o.id}')">Editar</button><button class="btn r s" onclick="removerObrigacao('${o.id}')">Remover</button></div>`).join('')}</div></div></div>`}

function opHome(){const crs=state.db.criadores.filter(c=>active(c)&&c.operador_id===state.operador);const media=crs.length?Math.round(crs.reduce((a,c)=>a+(state.k.rotina[c.id]||0),0)/crs.length):0;return head('Portal do colaborador','Escolha o operador e veja apenas seus criadores',selectOp('opPick',state.operador))+`<div class="metrics">${metric(crs.length,'Meus criadores','info')}${metric(media+'%','Rotina média','ok')}</div>${midiasList(crs)}`}
function opCriadores(){return head('Meus criadores','Projetos atribuídos ao operador',selectOp('opPick2',state.operador))+state.db.criadores.filter(c=>active(c)&&c.operador_id===state.operador).map(c=>`<div class="card"><div class="card-h"><div class="card-t">${esc(c.nome)}</div>${saudePill(state.k.saude[c.id]||0)}</div></div>`).join('')}
function opMidias(){return head('Mídias','Marcação semanal dos meus criadores')+midiasList(state.db.criadores.filter(c=>active(c)&&c.operador_id===state.operador))}
function opChamados(){return head('Chamados','Chamados dos meus criadores',`<button class="btn p" onclick="modalChamado()">+ Chamado</button>`)+chamadosList(state.db.chamados.filter(c=>byId(state.db.criadores,c.criador_id).operador_id===state.operador||c.responsavel_id===state.operador))}
function opDossie(){return head('Dossiê','Informações básicas, sem foco em senhas')+state.db.criadores.filter(c=>active(c)&&c.operador_id===state.operador).map(c=>dossieCard(c.id,true)).join('')}
function opLogs(){return head('Log extra','Registre algo para aparecer ao admin',`<button class="btn p" onclick="modalLog()">+ Log</button>`)+state.db.logs_extra.filter(l=>l.operador_id===state.operador).map(l=>`<div class="card"><div class="card-b">${esc(l.descricao)}<div class="muted small">${new Date(l.created_at).toLocaleString('pt-BR')}</div></div></div>`).join('')}

function crHome(){return `<div class="clean-creator">${head('Portal do criador','Tela limpa e simples',selectCri('crPick',state.criador))}${criadorResumo(state.criador)}</div>`}
function crTarefas(){const day=String(today().getDay()), obs=state.db.obrigacoes.filter(o=>active(o)&&(o.dia==='todos'||o.dia===day)&&(o.responsavel==='criador'||o.responsavel==='ambos'));return `<div class="clean-creator">${head('Minhas tarefas','Somente as obrigações de hoje')}${obs.map(o=>checkRow(state.criador,o)).join('')||empty('Você não tem tarefas hoje.')}</div>`}
function crMidias(){return `<div class="clean-creator">${head('Enviar mídias','Marque o que já enviou esta semana')}${midiasCreator(state.criador)}</div>`}
function crPend(){const n=state.db.notificacoes.filter(n=>n.criador_id===state.criador&&n.status!=='resolvida');return `<div class="clean-creator">${head('Pendências','Alertas e avisos importantes')}${n.map(x=>`<div class="card"><div class="card-b"><b>${esc(x.titulo)}</b><p>${esc(x.mensagem)}</p><button class="btn g" onclick="resolverNotif('${x.id}')">Resolvido</button></div></div>`).join('')||empty('Nenhuma pendência agora.')}</div>`}
function crChamados(){return `<div class="clean-creator">${head('Chamados','Abra um chamado para a equipe',`<button class="btn p" onclick="modalChamado('${state.criador}')">+ Chamado</button>`)}${chamadosList(state.db.chamados.filter(c=>c.criador_id===state.criador))}</div>`}

function empty(msg){return `<div class="card"><div class="card-b muted">${msg}</div></div>`}
function midiasList(cris){return cris.map(c=>`<div class="card"><div class="card-h"><div class="card-t">${esc(c.nome)}</div><div class="actions"><span class="pill info">${state.k.midias[c.id]||0}/3</span><button class="btn s" onclick="notificarMidias('${c.id}')">Notificar</button></div></div><div class="card-b">${midiasCreator(c.id)}</div></div>`).join('')||empty('Nenhum criador.')}
function midiasCreator(id){return ['rotineiro','ideias','adulto'].map(t=>{const m=state.db.midias_status.find(x=>x.criador_id===id&&x.tipo===t&&x.semana_key===semanaKey());return `<div class="row"><span class="grow">${t==='adulto'?'Mídias +18':t==='ideias'?'Ideias de conteúdo':'Conteúdo rotineiro'}</span><span class="pill ${m?.feito?'ok':'warn'}">${m?.feito?'enviado':'pendente'}</span><button class="btn s" onclick="toggleMidia('${id}','${t}')">${m?.feito?'Desfazer':'Marcar'}</button></div>`}).join('')}
function chamadosList(list){return list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(c=>`<div class="card"><div class="card-h"><div><div class="card-t">${esc(c.titulo||'Chamado')}</div><div class="muted small">${esc(crName(c.criador_id))} • ${esc(opName(c.responsavel_id))}</div></div>${statusPill(c.status)}</div><div class="card-b"><p>${esc(c.descricao||'')}</p><button class="btn s" onclick="statusChamado('${c.id}','andamento')">Andamento</button> <button class="btn g s" onclick="statusChamado('${c.id}','resolvido')">Resolver</button></div></div>`).join('')||empty('Nenhum chamado.')}
function dossieCard(id,basico=false){const d=state.db.dossies.find(x=>x.criador_id===id)?.dados||{};return `<div class="card"><div class="card-h"><div class="card-t">${esc(crName(id))}</div></div><div class="card-b"><div class="row"><span class="grow">E-mail</span><b>${esc(d.email||'-')}</b></div><div class="row"><span class="grow">Telefone</span><b>${esc(d.telefone||'-')}</b></div><div class="row"><span class="grow">Nascimento</span><b>${esc(d.nascimento||'-')}</b></div>${basico?'':`<div class="row"><span class="grow">Cofre</span><b>${esc(d.senhas||'-')}</b></div>`}</div></div>`}
function financeiroResumo(){const cris=state.db.criadores.filter(active);return `<div class="metrics">${metric(money(state.k.receita),'Receita mensal','ok')}${metric(cris.filter(c=>(state.k.fatMes[c.id]||0)>0).length+'/'+cris.length,'Criadores faturando','info')}</div><table class="table"><thead><tr><th>Criador</th><th>Mês</th><th>Semana</th><th>Ações</th></tr></thead><tbody>${cris.map(c=>`<tr><td>${esc(c.nome)}</td><td>${money(state.k.fatMes[c.id]||0)}</td><td>${money(state.k.fatSem[c.id]||0)}</td><td><button class="btn s" onclick="modalFaturamento('${c.id}')">Lançar</button></td></tr>`).join('')}</tbody></table>`}
function internoResumo(){const mk=mesKey(), mov=state.db.financeiro_interno.filter(f=>f.mes_key===mk), total=mov.reduce((a,f)=>a+Number(f.valor||0),0);return `<div class="metrics">${metric(money(total),'Saldo do mês',total>=0?'ok':'bad')}${metric(mov.length,'Lançamentos','info')}</div>${mov.map(f=>`<div class="row"><b class="grow">${esc(f.descricao)}</b><span>${money(f.valor)}</span></div>`).join('')}`}
function criadorResumo(id){const k=state.k.kpiMes[id]||{};return `<div class="metrics">${metric(money(state.k.fatMes[id]||0),'Faturamento mês','ok')}${metric(compact(k.seguidores),'Seguidores','info')}${metric(compact(k.assinantes),'Assinantes','blue')}${metric((state.k.rotina[id]||0)+'%','Rotina hoje','warn')}</div>${midiasCreator(id)}${dossieCard(id,true)}`}

async function toggleRotina(cri,ob){const old=state.db.rotina_status.find(r=>r.criador_id===cri&&r.obrigacao_id===ob&&r.dia_key===diaKey());const row={id:old?.id||uid('rot'),chave:`${cri}_${ob}_${diaKey()}`,criador_id:cri,obrigacao_id:ob,dia_key:diaKey(),feito:!old?.feito,feito_por:'CRM'};try{await dbUpsert('rotina_status',row);toast('Rotina salva.');await safeLoad()}catch(e){showError('Erro ao salvar rotina: '+errMsg(e));toast('Erro ao salvar rotina.')}}
async function toggleMidia(cri,tipo){const old=state.db.midias_status.find(m=>m.criador_id===cri&&m.tipo===tipo&&m.semana_key===semanaKey());const row={id:old?.id||uid('mid'),chave:`${cri}_${tipo}_${semanaKey()}`,criador_id:cri,tipo,semana_key:semanaKey(),feito:!old?.feito};try{await dbUpsert('midias_status',row);toast('Mídia salva.');await safeLoad()}catch(e){showError('Erro ao salvar mídia: '+errMsg(e));toast('Erro ao salvar mídia.')}}
async function statusChamado(id,status){try{await dbUpdate('chamados',id,{status});toast('Chamado atualizado.');await safeLoad()}catch(e){showError('Erro ao atualizar chamado: '+errMsg(e));toast('Erro ao atualizar chamado.')}}
async function resolverNotif(id){try{await dbUpdate('notificacoes',id,{status:'resolvida'});await safeLoad()}catch(e){showError('Erro ao resolver notificação: '+errMsg(e));toast('Erro ao resolver notificação.')}}

function modalFaturamento(cri=state.criador){openModal('Lançar faturamento',`${selectCri('f-cri',cri)}<div class="grid g2"><div class="field"><label>Privacy</label><input class="input" id="f-pri" type="number"></div><div class="field"><label>OnlyFans</label><input class="input" id="f-of" type="number"></div><div class="field"><label>Telegram VIP</label><input class="input" id="f-tg" type="number"></div><div class="field"><label>Venda avulsa</label><input class="input" id="f-av" type="number"></div></div><button class="btn p" onclick="salvarFaturamento()">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarFaturamento(){const pri=+($('f-pri').value||0),of=+($('f-of').value||0),tg=+($('f-tg').value||0),av=+($('f-av').value||0);await dbInsert('faturamento',{id:uid('fat'),criador_id:$('f-cri').value,data_ref:diaKey(),semana_key:semanaKey(),mes_key:mesKey(),privacy:pri,onlyfans:of,telegram_vip:tg,venda_avulsa:av,total:pri+of+tg+av});closeModal();toast('Faturamento salvo.');await safeLoad()}
function modalKPI(cri=state.criador){openModal('Lançar KPI social',`${selectCri('k-cri',cri)}<div class="field"><label>Plataforma</label><select class="select" id="k-plat"><option>Instagram</option><option>TikTok</option><option>X</option><option>Privacy</option><option>OnlyFans</option></select></div><div class="grid g2"><div class="field"><label>Seguidores</label><input class="input" id="k-seg" type="number"></div><div class="field"><label>Visualizações</label><input class="input" id="k-vis" type="number"></div><div class="field"><label>Assinantes</label><input class="input" id="k-ass" type="number"></div><div class="field"><label>Engajamento %</label><input class="input" id="k-eng" type="number"></div></div><button class="btn p" onclick="salvarKPI()">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarKPI(){await dbInsert('kpis_manuais',{id:uid('kpi'),criador_id:$('k-cri').value,plataforma:$('k-plat').value,data_ref:diaKey(),semana_key:semanaKey(),mes_key:mesKey(),seguidores:+$('k-seg').value||0,visualizacoes:+$('k-vis').value||0,assinantes:+$('k-ass').value||0,engajamento:+$('k-eng').value||0});closeModal();toast('KPI salvo.');await safeLoad()}
function modalChamado(cri=state.criador){openModal('Novo chamado',`${selectCri('ch-cri',cri)}${selectOp('ch-op',state.operador)}<div class="field"><label>Título</label><input class="input" id="ch-t"></div><div class="field"><label>Descrição</label><textarea class="area" id="ch-d"></textarea></div><button class="btn p" onclick="salvarChamado()">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarChamado(){await dbInsert('chamados',{criador_id:$('ch-cri').value,responsavel_id:$('ch-op').value,titulo:$('ch-t').value||'Chamado',descricao:$('ch-d').value,status:'aberto',prioridade:'normal',criado_por:'CRM'});closeModal();toast('Chamado salvo.');await safeLoad()}
function modalInterno(){openModal('Lançamento interno',`<div class="field"><label>Tipo</label><select class="select" id="i-t"><option>Receita</option><option>Despesa</option><option>Retirada</option><option>Salário</option></select></div><div class="field"><label>Descrição</label><input class="input" id="i-d"></div><div class="field"><label>Valor: use negativo para saída</label><input class="input" id="i-v" type="number"></div><button class="btn p" onclick="salvarInterno()">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarInterno(){await dbInsert('financeiro_interno',{tipo:$('i-t').value,descricao:$('i-d').value,valor:+$('i-v').value||0,data_ref:diaKey(),mes_key:mesKey()});closeModal();toast('Lançamento salvo.');await safeLoad()}
function modalOperador(id=''){const o=byId(state.db.operadores,id);openModal(id?'Editar operador':'Novo operador',`<div class="field"><label>Nome</label><input class="input" id="op-n" value="${esc(o.nome||'')}"></div><div class="field"><label>Função</label><input class="input" id="op-f" value="${esc(o.funcao||'Operador')}"></div><button class="btn p" onclick="salvarOperador('${id}')">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarOperador(id){await dbUpsert('operadores',{id:id||uid('op'),nome:$('op-n').value,funcao:$('op-f').value||'Operador',ativo:true});closeModal();toast('Operador salvo.');await safeLoad()}
async function removerOperador(id){if(!confirm('Remover operador?'))return;await dbUpdate('operadores',id,{ativo:false});await safeLoad()}
function modalCriador(id=''){const c=byId(state.db.criadores,id);openModal(id?'Editar criador':'Novo criador',`<div class="field"><label>Nome</label><input class="input" id="cr-n" value="${esc(c.nome||'')}"></div><div class="field"><label>Responsável</label>${selectOp('cr-op',c.operador_id||state.operador)}</div><button class="btn p" onclick="salvarCriador('${id}')">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarCriador(id){await dbUpsert('criadores',{id:id||uid('cr'),nome:$('cr-n').value,operador_id:$('cr-op').value,ativo:true});closeModal();toast('Criador salvo.');await safeLoad()}
async function removerCriador(id){if(!confirm('Remover criador?'))return;await dbUpdate('criadores',id,{ativo:false});await safeLoad()}
function modalObrigacao(id=''){const o=byId(state.db.obrigacoes,id);openModal(id?'Editar obrigação':'Nova obrigação',`<div class="field"><label>Nome</label><input class="input" id="ob-n" value="${esc(o.nome||'')}"></div><div class="field"><label>Responsável</label><select class="select" id="ob-r"><option ${o.responsavel==='raise'?'selected':''}>raise</option><option ${o.responsavel==='criador'?'selected':''}>criador</option><option ${o.responsavel==='ambos'?'selected':''}>ambos</option></select></div><div class="field"><label>Dia</label><select class="select" id="ob-d">${['todos','0','1','2','3','4','5','6'].map(d=>`<option ${o.dia===d?'selected':''}>${d}</option>`).join('')}</select></div><button class="btn p" onclick="salvarObrigacao('${id}')">Salvar</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarObrigacao(id){await dbUpsert('obrigacoes',{id:id||uid('ob'),nome:$('ob-n').value,responsavel:$('ob-r').value,dia:$('ob-d').value,ativo:true});closeModal();toast('Obrigação salva.');await safeLoad()}
async function removerObrigacao(id){await dbUpdate('obrigacoes',id,{ativo:false});await safeLoad()}
function modalDossie(){openModal('Editar dossiê',`${selectCri('ds-cri',state.criador)}<div class="field"><label>Email</label><input class="input" id="ds-email"></div><div class="field"><label>Telefone</label><input class="input" id="ds-tel"></div><div class="field"><label>Nascimento</label><input class="input" id="ds-nasc"></div><div class="field"><label>Cofre / observações</label><textarea class="area" id="ds-sen"></textarea></div><button class="btn p" onclick="salvarDossie()">Salvar</button>`)}
async function salvarDossie(){const cri=$('ds-cri').value;await dbUpsert('dossies',{id:'dos_'+cri,criador_id:cri,dados:{email:$('ds-email').value,telefone:$('ds-tel').value,nascimento:$('ds-nasc').value,senhas:$('ds-sen').value}});closeModal();toast('Dossiê salvo.');await safeLoad()}
function modalLog(){openModal('Novo log',`${selectCri('lg-cri',state.criador)}<div class="field"><label>Descrição</label><textarea class="area" id="lg-d"></textarea></div><button class="btn p" onclick="salvarLog()">Salvar</button>`)}
async function salvarLog(){await dbInsert('logs_extra',{operador_id:state.operador,criador_id:$('lg-cri').value,descricao:$('lg-d').value});closeModal();toast('Log salvo.');await safeLoad()}
async function notificarMidias(cri){try{await dbInsert('notificacoes',{criador_id:cri,operador_id:state.operador,titulo:'Enviar mídias',mensagem:'Você tem mídias pendentes para enviar esta semana.',prioridade:'alta',status:'aberta'});toast('Criador notificado.');await safeLoad()}catch(e){showError('Erro ao notificar: '+errMsg(e));toast('Erro ao notificar.')}}
function modalOnboarding(cri=state.criador){const ob=state.db.onboarding_status.find(o=>o.criador_id===cri);const passos=(ob?.passos||['Contrato assinado','Dossiê preenchido','Plataformas conferidas','Primeira rotina concluída']).map(p=>p.texto||p).join('\n');openModal('Editar onboarding',`${selectCri('onb-cri',cri)}<div class="field"><label>Passos, um por linha</label><textarea class="area" id="onb-passos" style="min-height:150px">${esc(passos)}</textarea></div><button class="btn p" onclick="salvarOnboarding()">Salvar passos</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
async function salvarOnboarding(){try{const cri=$('onb-cri').value;const atual=state.db.onboarding_status.find(o=>o.criador_id===cri);const antigos=atual?.passos||[];const passos=$('onb-passos').value.split('\n').map(x=>x.trim()).filter(Boolean).map(txt=>{const old=antigos.find(p=>(p.texto||p)===txt);return {texto:txt,feito:!!old?.feito}});await dbUpsert('onboarding_status',{id:'onb_'+cri,criador_id:cri,passos,finalizado:!!atual?.finalizado});closeModal();toast('Onboarding salvo.');await safeLoad()}catch(e){showError('Erro ao salvar onboarding: '+errMsg(e));toast('Erro ao salvar onboarding.')}}
async function toggleOnboardingPasso(cri,i){try{const atual=state.db.onboarding_status.find(o=>o.criador_id===cri);const passos=[...(atual?.passos||['Contrato assinado','Dossiê preenchido','Plataformas conferidas','Primeira rotina concluída'].map(texto=>({texto,feito:false})))];passos[i]=typeof passos[i]==='string'?{texto:passos[i],feito:true}:{...passos[i],feito:!passos[i].feito};await dbUpsert('onboarding_status',{id:'onb_'+cri,criador_id:cri,passos,finalizado:!!atual?.finalizado});await safeLoad()}catch(e){showError('Erro ao atualizar onboarding: '+errMsg(e));toast('Erro ao atualizar onboarding.')}}
async function finalizarOnboarding(cri){if(!confirm('Finalizar onboarding deste criador?'))return;try{await dbUpsert('onboarding_status',{id:'onb_'+cri,criador_id:cri,finalizado:true});await safeLoad()}catch(e){showError('Erro ao finalizar onboarding: '+errMsg(e));toast('Erro ao finalizar onboarding.')}}
async function resetMes(){if(!confirm('Resetar dados alimentados somente do mês atual?'))return;const mk=mesKey();for(const [t,arr] of [['faturamento',state.db.faturamento],['kpis_manuais',state.db.kpis_manuais],['financeiro_interno',state.db.financeiro_interno]]){for(const r of arr.filter(x=>x.mes_key===mk))await dbDelete(t,r.id)}for(const r of state.db.notificacoes.filter(x=>x.created_at?.slice(0,7)===mk))await dbDelete('notificacoes',r.id);toast('Mês atual resetado.');await safeLoad()}

function tick(){const d=today();$('clock').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})+' • '+pad(d.getHours())+':'+pad(d.getMinutes())}
tick();setInterval(tick,1000);
safeLoad();
setInterval(safeLoad,12000);
window.addEventListener('unhandledrejection',e=>{
 const msg='Erro ao usar o CRM: '+errMsg(e.reason);
 showError(msg);
 toast(msg);
});
window.addEventListener('error',e=>{
 const msg='Erro interno no CRM: '+(e.message||'verifique o arquivo publicado');
 showError(msg);
});
</script>
